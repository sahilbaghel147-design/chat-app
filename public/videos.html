<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Reels - Chat App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* ======================================= */
        /* ====== GLOBAL & THEME (Dark Mode) ======= */
        /* ======================================= */
        :root {
            --color-background: #121212;
            --color-background-secondary: #1e1e1e;
            --color-accent: #5e6bfe; 
            --color-text: #e0e0e0;
            --color-text-light: #aaa;
            --color-border: #333333;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; scroll-behavior: smooth; 
        }

        body {
            background: var(--color-background); color: var(--color-text); height: 100vh;
            display: flex; overflow: hidden; 
        }

        /* 1. Sidebar Styling */
        .sidebar {
            width: 280px; background: var(--color-background-secondary); padding: 20px 15px;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.3); height: 100vh; display: flex;
            flex-direction: column; border-right: 1px solid var(--color-border); flex-shrink: 0; z-index: 100;
        }
        
        .sidebar .nav-brand {
            font-size: 1.8em; font-weight: 800; color: var(--color-accent);
            text-align: center; margin-bottom: 25px; padding-bottom: 10px;
            border-bottom: 2px solid var(--color-accent);
        }
        .sidebar .nav-link-item {
            display: flex; align-items: center; padding: 12px 10px; margin-bottom: 8px;
            border-radius: 8px; font-weight: 500; color: var(--color-text); text-decoration: none;
            transition: background-color 0.3s;
        }
        .sidebar .nav-link-item i { margin-right: 10px; width: 20px; }
        .sidebar .nav-link-item:hover { background-color: var(--color-border); }
        .sidebar .nav-link-item.active { background-color: var(--color-accent); color: #fff !important; font-weight: bold; }
        
        .sidebar .logout-btn {
            background-color: #e74c3c; color: white; border: none; padding: 12px;
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: auto; 
            transition: opacity 0.3s;
        }
        .sidebar .logout-btn:hover { opacity: 0.8; }

        /* 2. Main Content Area (Video Reels) */
        #main-content {
            flex-grow: 1; display: flex; justify-content: center; align-items: center;
            height: 100vh; background: #000;
        }

        #reels-container {
            width: 100%; max-width: 450px; height: 100vh; overflow-y: scroll; 
            scroll-snap-type: y mandatory; background: #000;
        }

        .reel-card {
            width: 100%; height: 100vh; position: relative; scroll-snap-align: start; 
            display: flex; flex-direction: column; justify-content: flex-end; background-color: #000;
        }

        .reel-card video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        .video-overlay {
            position: relative; z-index: 2; padding: 20px; color: white;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0));
        }

        .video-overlay h3 { font-size: 1.5em; margin-bottom: 5px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .video-overlay p { font-size: 1em; margin-bottom: 20px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }

        /* Action Buttons (Like, Comment) */
        .actions-bar {
            position: absolute; right: 10px; bottom: 100px; z-index: 3;
            display: flex; flex-direction: column; gap: 20px; color: white;
        }

        .action-item { text-align: center; font-size: 1.1em; cursor: pointer; transition: color 0.2s; }
        .action-item i { font-size: 2em; margin-bottom: 5px; }
        .action-item:hover i { color: var(--color-accent); }
        
        /* 4. Mute Button Styling */
        .mute-toggle-btn {
            position: absolute; top: 20px; right: 20px; z-index: 4; 
            background: rgba(0, 0, 0, 0.5); color: white; border: 2px solid white;
            border-radius: 50%; width: 40px; height: 40px; display: flex;
            justify-content: center; align-items: center; cursor: pointer; transition: background 0.2s;
        }

        .mute-toggle-btn:hover { background: rgba(0, 0, 0, 0.8); }
        
        /* 5. MOBILE MENU BUTTON */
        .menu-toggle {
            display: none; position: absolute; top: 15px; left: 15px; z-index: 50;
            background: rgba(30, 30, 30, 0.7); color: white; border: none;
            padding: 10px 12px; border-radius: 8px; font-size: 1.2em; cursor: pointer;
        }
        
        /* 6. TRANSLATION WIDGET FIX: Hidden by default, placed neatly */
        #translate-wrapper {
            position: fixed; top: 15px; right: 15px; z-index: 102; /* Mute button se bhi upar */
            display: flex; align-items: center; gap: 10px;
        }
        
        #translate-toggle-btn {
            background-color: var(--color-accent); color: white; border: none;
            border-radius: 50%; width: 40px; height: 40px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2em; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        #google_translate_element {
            /* Initially hidden or placed off-screen */
            display: none; 
            background: var(--color-background-secondary);
            padding: 5px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* Show the widget when the button is active */
        #translate-wrapper.open #google_translate_element {
            display: block;
        }

        /* Hide the mobile menu button when sidebar is open to avoid conflict with translation widget on mobile */
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -280px; transition: left 0.3s ease-in-out; box-shadow: 8px 0 15px rgba(0, 0, 0, 0.5); }
            .sidebar.open { left: 0; }
            .menu-toggle { display: block; }
            #reels-container { max-width: 100%; }
            
            /* Adjust translation widget for mobile */
            #translate-wrapper { top: 15px; right: 15px; }
            .sidebar.open ~ #translate-wrapper { right: 290px; transition: right 0.3s ease-in-out; }
        }
    </style>
</head>
<body>
    
    <div id="translate-wrapper">
        <button id="translate-toggle-btn" title="Translate Page">
            <i class="fas fa-globe"></i>
        </button>
        <div id="google_translate_element"></div>
    </div>

    <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>

    <div class="sidebar" id="sidebar">
        <div class="nav-brand">Chat App</div>

        <a href="/index.html" class="nav-link-item"><i class="fas fa-home"></i> Home</a>
        <a href="/chat.html" class="nav-link-item"><i class="fas fa-comment-dots"></i> Chat</a>
        <a href="/games.html" class="nav-link-item"><i class="fas fa-gamepad"></i> Games</a>
        <a href="/videos.html" class="nav-link-item active"><i class="fas fa-video"></i> Reels</a>
        <a href="/about.html" class="nav-link-item"><i class="fas fa-info-circle"></i> About</a>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div id="main-content">
        <div id="reels-container">
            </div>
    </div>

    <script>
        // ===========================================
        // === App Logic (Login Check) ===
        // ===========================================
        let myUsername = localStorage.getItem("username");
        if (!myUsername) {
            window.location.replace("/login.html");
        }
        
        function logout() {
            localStorage.removeItem("username");
            window.location.replace("/login.html");
        }

        const videos = [
            // Your Videos (Ensure these are in your public/ folder)
            { title: "Babu's Funniest Moment", source: "/babu.mp4", description: "Laugh out loud with this funny clip!" },
            { title: "Whole.mp4 Clip", source: "/Whole.mp4", description: "A new engaging clip that's perfect for your feed." },
            { title: "MC Stand Live Performance", source: "/mcstand.mp4", description: "Watch the trending performance. Lit!" },
            { title: "Intense Exercise Clip", source: "/exer.mp4", description: "Time to hit the gym! Get motivated with this short workout." },
            { title: "Pain Reliever Clip", source: "/pain.mp4", description: "Take a moment to relax and enjoy this soothing video." },
            { title: "Sahil's Special", source: "/sahil2.mp4", description: "Exclusive content just for our users." },
            { title: "Oggy and the Cockroaches", source: "/Oggy.mp4", description: "The classic cartoon clip we all love." },
            { title: "Cool Op Video", source: "/opvideo.mp4", description: "An amazing, viral-worthy clip you must watch." }
        ];

        const reelsContainer = document.getElementById('reels-container');

        // Function to create and insert each reel card
        videos.forEach((video, index) => {
            const card = document.createElement('div');
            card.classList.add('reel-card');

            card.innerHTML = `
                <video id="video-${index}" src="${video.source}" loop preload="auto" muted playsinline></video>
                
                <div class="mute-toggle-btn" onclick="toggleMute(event, 'video-${index}')">
                    <i class="fas fa-volume-mute" id="mute-icon-video-${index}"></i> 
                </div>

                <div class="actions-bar">
                    <div class="action-item"><i class="fas fa-heart"></i><br>120</div>
                    <div class="action-item"><i class="fas fa-comment"></i><br>25</div>
                    <div class="action-item"><i class="fas fa-share"></i><br>Share</div>
                </div>

                <div class="video-overlay">
                    <h3>${video.title}</h3>
                    <p>${video.description}</p>
                </div>
            `;
            reelsContainer.appendChild(card);
        });

        // ===========================================
        // === Mute Toggle Logic ===
        // ===========================================
        function toggleMute(event, videoId) {
            event.stopPropagation();
            const video = document.getElementById(videoId);
            const icon = document.getElementById(`mute-icon-${videoId}`);

            if (video.muted) {
                video.muted = false;
                icon.classList.remove('fa-volume-mute');
                icon.classList.add('fa-volume-up'); 
            } else {
                video.muted = true;
                icon.classList.remove('fa-volume-up');
                icon.classList.add('fa-volume-mute'); 
            }
        }


        // ===========================================
        // === Video Playback Logic (CRITICAL FIX) ===
        // ===========================================
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target;
                if (entry.isIntersecting) {
                    video.play().catch(error => {
                        console.log('Video autoplay attempt failed, trying again if muted:', error);
                        // If play fails (due to audio policy), force mute and try again
                        if (!video.muted) {
                            video.muted = true;
                            // Update the mute icon for the user
                            document.getElementById(`mute-icon-${video.id}`).classList.remove('fa-volume-up');
                            document.getElementById(`mute-icon-${video.id}`).classList.add('fa-volume-mute'); 
                            video.play().catch(err => console.error('Final play attempt failed:', err));
                        }
                    });
                } else {
                    video.pause();
                    video.currentTime = 0; 
                }
            });
        }, {
            threshold: 0.8 
        });

        document.querySelectorAll('.reel-card video').forEach(video => {
            observer.observe(video);
        });

        reelsContainer.addEventListener('click', (e) => {
            if (e.target.tagName === 'VIDEO') {
                const video = e.target;
                if (video.paused) {
                    video.play().catch(err => console.log('Play failed on click:', err));
                } else {
                    video.pause();
                }
            }
        });
        
        // ===========================================
        // === Mobile Menu Toggle Logic ===
        // ===========================================
        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menu-toggle');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open'); 
            
            const icon = menuToggle.querySelector('i');
            if (sidebar.classList.contains('open')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            }
        });
        
        document.addEventListener('click', (e) => {
            if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                sidebar.classList.remove('open');
                menuToggle.querySelector('i').classList.remove('fa-times');
                menuToggle.querySelector('i').classList.add('fa-bars');
            }
        });
        
        // ===========================================
        // === 🔑 NEW: TRANSLATION TOGGLE LOGIC ===
        // ===========================================
        const translateToggleBtn = document.getElementById('translate-toggle-btn');
        const translateWrapper = document.getElementById('translate-wrapper');
        
        translateToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Page ke doosre clicks ko rokne ke liye
            translateWrapper.classList.toggle('open');
        });
        
        // Close the widget if clicked outside
        document.addEventListener('click', (e) => {
            if (translateWrapper.classList.contains('open') && !translateWrapper.contains(e.target)) {
                translateWrapper.classList.remove('open');
            }
        });
        
    </script>
    
    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en', 
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
