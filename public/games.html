<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Games</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root {
            --color-dark-bg: #1a1a2e;       
            --color-card-bg: #22223b;       
            --color-primary: #79a6fe;       
            --color-text: #f0f4f8;          
            --color-secondary-text: #b8c2cc;
        }
        body {
            background-color: var(--color-dark-bg);
            color: var(--color-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .game-container {
            padding: 50px 20px;
        }
        .game-area {
            width: 100%;
            max-width: 600px;
            height: 400px; /* Game view height */
            background-color: #000;
            border: 5px solid var(--color-primary);
            margin: 30px auto;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: var(--color-primary);
            color: white;
            border-radius: 5px;
            text-decoration: none;
        }
        /* Game code place holder */
        .placeholder {
            padding-top: 150px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Aura Level Game (Coming Soon!)</h1>
        <p>This section is ready for your new high-score arcade game. The UI is set!</p>
        
        <div class="game-area">
            <div class="placeholder">
                <i class="fas fa-gamepad" style="font-size: 50px; color: var(--color-primary);"></i>
                <p style="margin-top: 10px;">New Game Placeholder</p>
            </div>
        </div>
        
        <a href="/index.html" class="back-button"><i class="fas fa-arrow-left"></i> Back to Hub</a>
    </div>
</body>
</html>
