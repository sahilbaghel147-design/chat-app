<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile - Aura Hub</title>
  <style>
    body {
      background: #1e1e2f;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #2c2c3e;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }
    h2 {
      color: #5e6bfe;
    }
    img {
      border-radius: 50%;
      width: 120px;
      height: 120px;
      object-fit: cover;
      margin: 15px auto;
      display: block;
      border: 3px solid #5e6bfe;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #5e6bfe;
      border: none;
      color: white;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #4a59e6;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
      color: yellow;
    }
    nav {
      background: #3c3c55;
      padding: 12px;
      text-align: center;
      margin-bottom: 20px;
    }
    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      color: #5e6bfe;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/index.html">Home</a>
    <a href="/chat.html">Chat</a>
    <a href="/profile.html">Profile</a>
    <a href="/games.html">Games</a>
    <a href="/videos.html">Videos</a>
    <a href="/about.html">About</a>
  </nav>

  <div class="container">
    <h2>My Profile</h2>
    <img id="avatarPreview" src="https://res.cloudinary.com/demo/image/upload/sample.jpg" alt="Avatar"/>
    
    <input type="file" id="fileInput" accept="image/*"/>
    <button onclick="uploadProfile()">Upload Picture</button>

    <textarea id="bioInput" placeholder="Write your bio..."></textarea>
    <button onclick="saveBio()">Save Bio</button>

    <div id="status"></div>
  </div>

  <script>
    const username = localStorage.getItem("username");

    // Load saved avatar from localStorage
    document.addEventListener("DOMContentLoaded", () => {
      const savedPic = localStorage.getItem("profilePicture");
      if (savedPic) {
        document.getElementById("avatarPreview").src = savedPic;
      }
    });

    async function uploadProfile() {
      const file = document.getElementById("fileInput").files[0];
      if (!file) {
        alert("Please select a file");
        return;
      }

      const formData = new FormData();
      formData.append("chatfile", file);
      formData.append("username", username);

      document.getElementById("status").textContent = "Uploading...";

      try {
        const res = await fetch("/api/profile/upload", {
          method: "POST",
          body: formData,
        });

        const data = await res.json();
        if (data.success) {
          document.getElementById("status").style.color = "lightgreen";
          document.getElementById("status").textContent = "Profile updated!";
          document.getElementById("avatarPreview").src = data.profilePicture;
          localStorage.setItem("profilePicture", data.profilePicture);
        } else {
          document.getElementById("status").style.color = "red";
          document.getElementById("status").textContent = data.message;
        }
      } catch (err) {
        console.error(err);
        document.getElementById("status").style.color = "red";
        document.getElementById("status").textContent = "Upload failed!";
      }
    }

    async function saveBio() {
      const bio = document.getElementById("bioInput").value;
      document.getElementById("status").textContent = "Saving bio...";

      try {
        const res = await fetch("/api/profile/bio", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, bio }),
        });

        const data = await res.json();
        if (data.success) {
          document.getElementById("status").style.color = "lightgreen";
          document.getElementById("status").textContent = "Bio saved!";
        } else {
          document.getElementById("status").style.color = "red";
          document.getElementById("status").textContent = data.message;
        }
      } catch (err) {
        console.error(err);
        document.getElementById("status").style.color = "red";
        document.getElementById("status").textContent = "Failed to save bio!";
      }
    }
  </script>
</body>
</html>
