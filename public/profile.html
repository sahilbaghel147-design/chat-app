<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .profile-container {
      max-width: 400px;
      margin: 40px auto;
      background: #1e1e2e;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      text-align: center;
    }
    .profile-container h2 {
      color: #4c6ef5;
      margin-bottom: 15px;
    }
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #4c6ef5;
      margin-bottom: 15px;
    }
    .input-box {
      margin: 10px 0;
      width: 100%;
    }
    .input-box input[type="file"],
    .input-box textarea {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      margin-top: 5px;
    }
    .btn {
      background: #4c6ef5;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover {
      background: #364fc7;
    }
    .error { color: red; margin-top: 10px; }
    .success { color: lime; margin-top: 10px; }
  </style>
</head>
<body>
  <!-- 🔹 Navbar -->
  <nav style="background:#4c6ef5; padding:10px; text-align:center;">
    <a href="index.html" style="color:white; margin:0 10px;">Home</a>
    <a href="chat.html" style="color:white; margin:0 10px;">Chat</a>
    <a href="profile.html" style="color:yellow; margin:0 10px;">Profile</a>
    <a href="games.html" style="color:white; margin:0 10px;">Games</a>
    <a href="videos.html" style="color:white; margin:0 10px;">Videos</a>
    <a href="about.html" style="color:white; margin:0 10px;">About</a>
  </nav>

  <div class="profile-container">
    <h2>My Profile</h2>
    <img id="avatarPreview" src="assets/default_avatar.png" alt="Avatar" class="profile-avatar" />

    <!-- Upload Form -->
    <form id="uploadForm" enctype="multipart/form-data" class="input-box">
      <input type="file" name="avatar" required />
      <button type="submit" class="btn">Upload Picture</button>
    </form>

    <!-- Bio Form -->
    <form id="bioForm" class="input-box">
      <textarea name="bio" placeholder="Write your bio..." rows="3"></textarea>
      <button type="submit" class="btn">Save Bio</button>
    </form>

    <div id="messageBox"></div>
  </div>

  <script>
    const username = localStorage.getItem("username") || "guest"; // 🔹 user identity (temp)

    // ✅ Upload Avatar
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);

      const res = await fetch("/api/upload", {
        method: "POST",
        body: formData
      });
      const data = await res.json();

      const msgBox = document.getElementById("messageBox");
      if (data.success) {
        document.getElementById("avatarPreview").src = data.url;
        msgBox.innerHTML = `<p class="success">✅ Picture uploaded!</p>`;
        // save in localStorage for chat use
        localStorage.setItem("avatar", data.url);
      } else {
        msgBox.innerHTML = `<p class="error">❌ Upload failed: ${data.message}</p>`;
      }
    });

    // ✅ Save Bio
    document.getElementById("bioForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const bio = e.target.bio.value;

      const res = await fetch("/api/bio", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, bio })
      });
      const data = await res.json();

      const msgBox = document.getElementById("messageBox");
      if (data.success) {
        msgBox.innerHTML = `<p class="success">✅ Bio saved!</p>`;
      } else {
        msgBox.innerHTML = `<p class="error">❌ Failed: ${data.error}</p>`;
      }
    });
  </script>
</body>
</html>
