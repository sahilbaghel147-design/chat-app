<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* Add your profile specific styles here */
        .profile-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            text-align: center;
        }
        .profile-picture-upload {
            margin-bottom: 20px;
        }
        .profile-picture-upload img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3498db;
        }
        .profile-picture-upload label {
            cursor: pointer;
            color: #3498db;
            display: block;
            margin-top: 10px;
        }
        .profile-picture-upload input[type="file"] {
            display: none;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .score-box {
            background-color: #eaf6ff;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: bold;
            color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <a href="/chat.html" style="float: left; text-decoration: none;">&larr; Back to Chat</a>
        <h1 id="profile-header">User Profile: <span id="username-display">Loading...</span></h1>
        
        <div class="profile-picture-upload">
            <img id="profile-img" src="uploads/default_avatar.jpg" alt="Profile Picture">
            <label for="profile-file-input">
                Click to change Picture
            </label>
            <input type="file" id="profile-file-input" accept="image/*">
        </div>

        <div class="score-box">
            🏆 Best Snake Score: <span id="best-snake-score">0</span>
        </div>

        <div class="form-group">
            <label>Username:</label>
            <input type="text" id="username-input" disabled>
        </div>

        <div class="form-group">
            <label for="bio-input">Your Bio (Max 160 Chars)</label>
            <textarea id="bio-input" maxlength="160" placeholder="Tell us about yourself..."></textarea>
        </div>

        <button id="update-profile-btn" onclick="updateProfile()">Update Profile</button>
        <p id="message-status" style="margin-top: 10px;"></p>
    </div>

<script>
    // --- UTILITIES & AUTHENTICATION ---
    let currentUsername = null;

    function displayStatus(message, isSuccess = true) {
        const statusElement = document.getElementById('message-status');
        statusElement.textContent = message;
        statusElement.style.color = isSuccess ? 'green' : 'red';
    }

    // --- PROFILE LOAD LOGIC (FIXED) ---
    async function loadProfile() {
        const username = localStorage.getItem('username');

        // FIX: Strong check for null, empty string, or the literal string "undefined"
        if (!username || username === "undefined" || username.trim() === "") {
            console.log("Profile: Invalid username. Redirecting to login.");
            // If the user lands here with bad data, clear it and redirect
            localStorage.clear();
            window.location.href = '/login.html';
            return;
        }

        currentUsername = username.trim();
        document.getElementById('username-display').textContent = currentUsername;
        document.getElementById('username-input').value = currentUsername;
        document.getElementById('profile-header').textContent = `User Profile: ${currentUsername}`;

        try {
            const response = await fetch(`/api/profile/${currentUsername}`);
            const data = await response.json();

            if (data.success) {
                const user = data.user;
                document.getElementById('bio-input').value = user.bio || '';
                document.getElementById('best-snake-score').textContent = user.bestSnakeScore || 0;
                document.getElementById('profile-img').src = user.profilePicture ? `/${user.profilePicture}` : '/uploads/default_avatar.jpg';
            } else {
                displayStatus(`Failed to load profile data: ${data.message}`, false);
                alert('Failed to load profile data.');
            }
        } catch (error) {
            console.error("Error loading profile:", error);
            displayStatus('Error connecting to server.', false);
        }
    }

    // --- PROFILE UPDATE LOGIC ---
    async function updateProfile() {
        const bio = document.getElementById('bio-input').value;
        const bestSnakeScore = document.getElementById('best-snake-score').textContent;

        displayStatus('Updating...', false);

        try {
            const response = await fetch('/api/profile/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: currentUsername,
                    bio: bio,
                    bestSnakeScore: parseInt(bestSnakeScore, 10) // Ensure score is a number
                })
            });
            const data = await response.json();

            if (data.success) {
                displayStatus('Profile updated successfully!', true);
            } else {
                displayStatus(`Update failed: ${data.message}`, false);
            }
        } catch (error) {
            displayStatus('Error updating profile.', false);
            console.error("Update error:", error);
        }
    }

    // --- PICTURE UPLOAD LOGIC ---
    document.getElementById('profile-file-input').addEventListener('change', async function() {
        if (!this.files.length) return;

        displayStatus('Uploading image...', false);
        const file = this.files[0];
        const formData = new FormData();
        
        formData.append('chatfile', file);
        formData.append('username', currentUsername); // Send username for identification

        try {
            const response = await fetch('/api/profile/upload', {
                method: 'POST',
                body: formData 
            });
            const data = await response.json();

            if (data.success) {
                document.getElementById('profile-img').src = `/${data.profilePicture}`;
                displayStatus('Profile picture updated successfully!', true);
            } else {
                displayStatus(`Upload failed: ${data.message}`, false);
            }
        } catch (error) {
            displayStatus('Error uploading picture.', false);
            console.error("Upload error:", error);
        }
    });

    // Load profile on page load
    loadProfile();
</script>
</body>
</html>
