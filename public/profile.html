<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* ... (Keep your CSS styles here) ... */
    </style>
</head>
<body>

    <div class="profile-container">
        <a href="/chat.html" style="float: left; text-decoration: none;">&larr; Back to Chat</a>
        <h1 id="profile-header">User Profile: <span id="username-display">Loading...</span></h1>
        
        <div class="profile-picture-upload">
            <img id="profile-img" src="uploads/default_avatar.jpg" alt="Profile Picture">
            <label for="profile-file-input">
                Click to change Picture
            </label>
            <input type="file" id="profile-file-input" accept="image/*">
        </div>

        <div class="score-box">
            🏆 Best Snake Score: <span id="best-snake-score">0</span>
        </div>

        <div class="form-group">
            <label>Username:</label>
            <input type="text" id="username-input" disabled>
        </div>

        <div class="form-group">
            <label for="bio-input">Your Bio (Max 160 Chars)</label>
            <textarea id="bio-input" maxlength="160" placeholder="Tell us about yourself..."></textarea>
        </div>

        <button id="update-profile-btn" onclick="updateProfile()">Update Profile</button>
        <p id="message-status" style="margin-top: 10px;"></p>
    </div>

<script>
    // --- UTILITIES & AUTHENTICATION ---
    let currentUsername = null;

    function displayStatus(message, isSuccess = true) {
        const statusElement = document.getElementById('message-status');
        statusElement.textContent = message;
        statusElement.style.color = isSuccess ? 'green' : 'red';
    }

    // --- PROFILE LOAD LOGIC (FIXED) ---
    async function loadProfile() {
        const username = localStorage.getItem('username');

        // FIX: Prevents 'Loading undefined's profile...' error
        if (!username || username === "undefined" || username.trim() === "") {
            console.log("Profile: Invalid username. Clearing data and redirecting to login.");
            localStorage.clear();
            window.location.href = '/login.html';
            return;
        }

        currentUsername = username.trim();
        document.getElementById('username-display').textContent = currentUsername;
        document.getElementById('username-input').value = currentUsername;
        document.getElementById('profile-header').textContent = `User Profile: ${currentUsername}`;

        try {
            const response = await fetch(`/api/profile/${currentUsername}`);
            const data = await response.json();

            if (data.success) {
                const user = data.user;
                document.getElementById('bio-input').value = user.bio || '';
                document.getElementById('best-snake-score').textContent = user.bestSnakeScore || 0;
                document.getElementById('profile-img').src = user.profilePicture ? `/${user.profilePicture}` : '/uploads/default_avatar.jpg';
            } else {
                displayStatus(`Failed to load profile data: ${data.message}`, false);
                alert('Failed to load profile data.'); // Show alert for failed data load
            }
        } catch (error) {
            console.error("Error loading profile:", error);
            displayStatus('Error connecting to server. Please try again.', false);
        }
    }

    // ... (rest of the updateProfile and profile-file-input event listener functions) ...

    // Load profile on page load
    loadProfile();
</script>
</body>
</html>
