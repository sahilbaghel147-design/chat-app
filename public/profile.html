<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura Hub - Profile</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0f0f1a;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Navbar */
    nav {
      background: linear-gradient(135deg, #5e6bfe, #4a59e6);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    }
    nav a {
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      transition: 0.3s;
    }
    nav a:hover {
      background: rgba(255,255,255,0.2);
    }
    nav a.active {
      background: rgba(255,255,255,0.3);
    }

    /* Profile Container */
    .container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .profile-card {
      background: #1c1c2c;
      padding: 30px;
      border-radius: 15px;
      width: 350px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }
    .profile-card h2 {
      margin-bottom: 20px;
      color: #5e6bfe;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #5e6bfe;
      margin-bottom: 15px;
    }
    input[type="file"] {
      margin: 10px 0;
    }
    textarea {
      width: 100%;
      height: 70px;
      border-radius: 10px;
      border: none;
      padding: 10px;
      background: #2a2a3d;
      color: white;
      resize: none;
      margin-top: 10px;
    }
    button {
      background: #5e6bfe;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #4a59e6;
    }
    #statusMessage {
      margin-top: 12px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav>
    <a href="/index.html">Home</a>
    <a href="/chat.html">Chat</a>
    <a href="/profile.html" class="active">Profile</a>
    <a href="/games.html">Games</a>
    <a href="/about.html">About</a>
  </nav>

  <!-- Profile Section -->
  <div class="container">
    <div class="profile-card">
      <h2>My Profile</h2>
      <img id="profilePic" src="/uploads/default_avatar.jpg" alt="Avatar" class="avatar"/>
      
      <form id="uploadForm">
        <input type="file" id="fileInput" name="chatfile" accept="image/*"/>
        <button type="submit">Upload Picture</button>
      </form>

      <textarea id="bioInput" placeholder="Write your bio..."></textarea>
      <button id="saveBioBtn">Save Bio</button>
      
      <div id="statusMessage"></div>
    </div>
  </div>

  <script>
    const username = localStorage.getItem("username") || "Guest";
    const profilePic = document.getElementById("profilePic");
    const bioInput = document.getElementById("bioInput");
    const uploadForm = document.getElementById("uploadForm");
    const statusMessage = document.getElementById("statusMessage");
    const saveBioBtn = document.getElementById("saveBioBtn");

    // ✅ Load Profile Data from Server
    async function loadProfile() {
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password: "dummy" }) // password is dummy here
        });
        // 🚨 But actually safer is to store profile data in localStorage at login
        // Here we just load from localStorage if available
        const pic = localStorage.getItem("profilePicture");
        const bio = localStorage.getItem("bio");

        if (pic) profilePic.src = pic;
        if (bio) bioInput.value = bio;
      } catch (err) {
        console.error("Profile load error:", err);
      }
    }

    loadProfile();

    // ✅ Upload Profile Picture
    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = document.getElementById("fileInput").files[0];
      if (!file) {
        statusMessage.style.color = "red";
        statusMessage.textContent = "Please select a file!";
        return;
      }
      const formData = new FormData();
      formData.append("chatfile", file);
      formData.append("username", username);

      try {
        const res = await fetch("/api/profile/upload", {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          profilePic.src = data.profilePicture + "?t=" + Date.now(); // force refresh
          localStorage.setItem("profilePicture", data.profilePicture);
          statusMessage.style.color = "lightgreen";
          statusMessage.textContent = "Profile picture updated!";
        } else {
          statusMessage.style.color = "red";
          statusMessage.textContent = data.message;
        }
      } catch (err) {
        statusMessage.style.color = "red";
        statusMessage.textContent = "Upload failed!";
      }
    });

    // ✅ Save Bio
    saveBioBtn.addEventListener("click", async () => {
      const bio = bioInput.value.trim();
      if (!bio) {
        statusMessage.style.color = "red";
        statusMessage.textContent = "Bio cannot be empty.";
        return;
      }

      try {
        // 🚨 For now just save to localStorage (API bana denge agar chaho)
        localStorage.setItem("bio", bio);
        statusMessage.style.color = "lightgreen";
        statusMessage.textContent = "Bio saved successfully!";
      } catch (err) {
        statusMessage.style.color = "red";
        statusMessage.textContent = "Error saving bio.";
      }
    });
  </script>
</body>
</html>
