<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura Hub - Chat</title>
  
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* 🚨 FINAL WORKING UI CSS */
    :root {
      --color-primary: #5e6bfe;
      --color-dark-bg: #181828;
      --color-chat-bg: #181828;
      --color-sidebar-bg: #1c1c2c;
      --color-component-bg: #2a2a3d;
      --color-text: #f0f0f0;
      --color-error: #ef4444;
      --color-online: #4CAF50;
      --radius: 10px;
    }

    /* Basic Layout */
    body {
      margin: 0; padding: 0; background: var(--color-dark-bg); color: var(--color-text);
      font-family: "Segoe UI", sans-serif; display: flex; flex-direction: column; min-height: 100vh;
    }
    nav {
      background: var(--color-primary);
      padding: 12px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a { color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; }

    .chat-container {
      flex: 1; display: flex; height: calc(100vh - 50px); overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 250px; background: var(--color-sidebar-bg); padding: 15px; flex-shrink: 0; overflow-y: auto;
    }
    .online-users-header { color: var(--color-primary); border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 10px; }
    
    #usersList { list-style: none; padding: 0; }
    .user {
      padding: 8px; background: var(--color-component-bg); margin: 4px 0; border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; gap: 10px; transition: background 0.2s;
    }
    .user:hover, .user.active { background: #3a3a5a; }
    .online-dot { width: 8px; height: 8px; background: var(--color-online); border-radius: 50%; display: inline-block; }

    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--color-chat-bg); overflow: hidden; }
    #chatRecipientHeader { padding: 15px; background: var(--color-sidebar-bg); border-bottom: 1px solid #333; }
    #chatBox { flex: 1; padding: 15px; overflow-y: auto; }
    
    /* Input Area */
    #inputArea { display: flex; padding: 10px 20px; background: var(--color-sidebar-bg); border-top: 1px solid #333; flex-shrink: 0; }
    #messageInput { flex: 1; padding: 12px; border-radius: 20px; border: none; background: var(--color-component-bg); color: white; }
    #sendButton { background: var(--color-primary); border: none; border-radius: 50%; width: 45px; height: 45px; margin-left: 8px; color: white; font-size: 1.2em; cursor: pointer; }
    
    /* Message Bubbles */
    .msg-row { display: flex; margin: 6px 0; align-items: flex-end; }
    .msg { padding: 10px 14px; border-radius: 15px; max-width: 70%; line-height: 1.4; }
    .me { background: var(--color-primary); color: white; margin-left: auto; }
    .other { background: var(--color-component-bg); color: var(--color-text); margin-right: auto; }
    .username-tag { font-size: 0.75em; opacity: 0.7; margin-bottom: 3px; display: block; }
  </style>
</head>
<body>
  <nav>
    <div class="brand">ChatHub</div>
    <div style="flex-grow: 1; text-align: center;">
        <a href="/index.html">Home</a>
        <a href="/chat.html" class="active">Chat</a>
        <a href="/profile.html">Profile</a>
        <a href="/games.html">Games</a>
        <a href="/videos.html">Videos</a>
        <a href="/about.html">About</a>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <div class="chat-container">
    <div class="sidebar">
      <h3 class="online-users-header">🟢 Online Users</h3>
      <div id="usersList"></div>
    </div>

    <div class="chat-area">
        <h2 id="chatRecipientHeader">Select a User to Chat</h2>
      <div id="chatBox"></div>
      <div id="inputArea">
        <input type="text" id="messageInput" placeholder="Type your message..."/>
        <button id="sendButton">➤</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let username = localStorage.getItem("username") || "Guest";
    let currentRecipient = null;

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const usersList = document.getElementById("usersList");
    const chatRecipientHeader = document.getElementById("chatRecipientHeader");

    if (username === "Guest") {
        window.location.href = "/login.html";
    }

    // --- Core Functions ---

    function startChat(recipient) {
        if (recipient === currentRecipient) return;
        
        currentRecipient = recipient;
        chatRecipientHeader.textContent = `Chatting with: ${recipient}`;
        chatBox.innerHTML = ''; 
        
        // Highlight active user
        document.querySelectorAll('.user').forEach(el => el.classList.remove('active'));
        document.querySelector(`.user[data-username="${recipient}"]`).classList.add('active');
        
        // Add placeholder message
        chatBox.innerHTML = `<div class="muted" style="text-align:center; padding:20px;">Loading chat history...</div>`;
        
        // Fetch chat history (Your server needs to handle this event)
        socket.emit("loadChat", { user1: username, user2: recipient }); 
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !currentRecipient) {
          if (!currentRecipient) alert("Please select an online user first.");
          return;
      }
      
      // 🚨 FIX: Emit privateMessage with correct recipient
      const messagePayload = { 
          sender: username, 
          receiver: currentRecipient, 
          text: text,
          timestamp: new Date().toISOString()
      };
      
      socket.emit("privateMessage", messagePayload); 
      
      // Optimistic render (show my own message immediately)
      addMessage(messagePayload, true);
      messageInput.value = "";
    }

    function addMessage(msg, isSelf=false) {
        // Filter out messages that don't belong to the current chat window
        if (!isSelf && msg.sender !== currentRecipient) return; 

        const row = document.createElement("div");
        row.classList.add("msg-row");

        const bubble = document.createElement("div");
        bubble.classList.add("msg");
        
        // Determine alignment and styling
        const senderName = msg.sender === username ? 'You' : msg.sender;

        if (isSelf || msg.sender === username) {
            row.classList.add("me");
            bubble.innerHTML = `<div class="username-tag">You</div>${msg.text}`;
        } else {
            row.classList.add("other");
            bubble.innerHTML = `<div class="username-tag">${msg.sender}</div>${msg.text}`;
        }
        
        row.appendChild(bubble); // Simple structure for now
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- Socket Logic ---
    sendButton.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
          e.preventDefault();
          sendMessage();
      }
    });

    socket.on("newUser", username); // Initial registration
    socket.emit("newUser", username); // Register user

    socket.on("updateUsers", (users) => { // Array of usernames
      usersList.innerHTML = "";
      users.forEach(u => {
        if (u !== username) {
            const div = document.createElement("div");
            div.classList.add("user");
            div.textContent = u;
            div.dataset.username = u;
            // 🔑 Start chat on user click
            div.onclick = () => startChat(u); 
            usersList.appendChild(div);
        }
      });
    });

    // Listener for private messages (for both sender and receiver)
    socket.on("privateMessage", (msg) => {
        // Display if the message is for the current chat
        if (msg.sender === currentRecipient || msg.receiver === currentRecipient) {
             addMessage(msg);
        }
    });
    
    // Listener for chat history retrieval
    socket.on("chatHistory", (history) => {
        chatBox.innerHTML = ''; // Clear "loading" message
        history.forEach(msg => addMessage(msg));
    });

    // --- Logout ---
    document.querySelector('.logout-btn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = "/login.html";
    });
  </script>
</body>
</html>
