<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Snake Game - Leaderboard</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root {
            --color-dark-bg: #1a1a2e;       
            --color-card-bg: #22223b;       
            --color-primary: #79a6fe;       
            --color-text: #f0f4f8;          
            --color-secondary-text: #b8c2cc;
            --color-snake: #4CAF50;         
            --color-food: #FF5722;          
            --color-button-hover: #5d88ff;  
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-dark-bg);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .game-container {
            padding: 20px 20px 50px;
            max-width: 900px; /* Increased max width to fit leaderboard */
            margin: 0 auto;
        }
        h1 {
            color: var(--color-primary);
            margin-bottom: 5px;
        }
        .game-main-content {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }
        .game-info {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.2em;
        }
        .score, .high-score {
            padding: 8px 15px;
            background: var(--color-card-bg);
            border-radius: 8px;
            border: 1px solid var(--color-primary);
        }

        /* --- Game Canvas Area --- */
        #gameCanvas {
            border: 5px solid var(--color-primary);
            background-color: #000000;
            display: block;
            margin: 0; /* Adjusted margin */
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(121, 166, 254, 0.5);
            width: 400px; 
            height: 400px;
        }

        .controls {
            margin-top: 30px;
        }
        .btn-start {
            background-color: var(--color-primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s;
        }
        .btn-start:hover {
            background-color: var(--color-button-hover);
        }
        .back-button {
            background: none;
            color: var(--color-secondary-text);
            border: none;
            padding: 10px;
            cursor: pointer;
            text-decoration: none;
            margin-left: 20px;
        }
        
        /* --- Leaderboard Styles --- */
        .leaderboard {
            width: 300px;
            background: var(--color-card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            text-align: left;
        }
        .leaderboard h3 {
            color: var(--color-food);
            border-bottom: 2px solid var(--color-primary);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .leaderboard ol {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .leaderboard li {
            display: flex;
            justify-content: space-between;
            padding: 8px 5px;
            border-bottom: 1px dashed var(--color-secondary-text);
            font-size: 1.1em;
        }
        .leaderboard li:last-child {
            border-bottom: none;
        }
        .rank {
            font-weight: bold;
            color: var(--color-primary);
            width: 30px;
        }
        .score-value {
            color: var(--color-food);
            font-weight: bold;
        }

        /* Mobile Controls */
        .mobile-controls {
            display: none;
            margin-top: 20px;
            justify-content: center;
            gap: 10px;
        }
        .mobile-controls button {
            background: var(--color-card-bg);
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
        }
        
        @media (max-width: 900px) {
            .game-main-content {
                flex-direction: column;
                align-items: center;
            }
            .leaderboard {
                width: 400px;
                margin-top: 30px;
            }
        }
        @media (max-width: 600px) {
            #gameCanvas, .leaderboard {
                width: 95%; 
                height: 350px;
            }
            .mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Retro Snake Game 🐍</h1>
        <p style="color: var(--color-secondary-text);">Use Arrow Keys or Mobile Controls to play!</p>

        <div class="game-info">
            <div class="score">Score: <span id="currentScore">0</span></div>
            <div class="high-score">My Best: <span id="highScore">0</span></div>
        </div>

        <div class="game-main-content">
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <div class="leaderboard">
                <h3>Top 10 Global Scores</h3>
                <ol id="leaderboardList">
                    <li>Loading...</li>
                </ol>
            </div>
        </div>


        <div class="controls">
            <button id="startButton" class="btn-start">Start Game</button>
            <a href="/index.html" class="back-button">Back to Hub</a>
        </div>
        
        <div class="mobile-controls">
            <button id="upBtn"><i class="fas fa-arrow-up"></i></button>
            <button id="leftBtn"><i class="fas fa-arrow-left"></i></button>
            <button id="downBtn"><i class="fas fa-arrow-down"></i></button>
            <button id="rightBtn"><i class="fas fa-arrow-right"></i></button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Elements and Constants ---
            const username = localStorage.getItem('username');
            if (!username) {
                alert("Please login to play the game and save your score.");
                window.location.href = '/login.html';
                return;
            }

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d'); 
            const currentScoreEl = document.getElementById('currentScore');
            const highScoreEl = document.getElementById('highScore');
            const startButton = document.getElementById('startButton');
            const leaderboardList = document.getElementById('leaderboardList'); // NEW ELEMENT

            const gridSize = 20; 
            const tileCount = 400 / gridSize; // 20 tiles
            
            let snake = [];
            let food = {};
            let velocity = { x: 1, y: 0 };
            let gameLoop;
            let gameSpeed = 150; 
            let score = 0;
            let isGameOver = true;
            let nextDirection = null;
            
            // Local high score for initial display
            let localHighScore = localStorage.getItem('snakeHighScore') || 0;
            highScoreEl.textContent = localHighScore;
            
            // --- Helper Function: Draw a single square (tile) ---
            function drawSquare(x, y, color, shadowBlur = 0, shadowColor = 'transparent') {
                ctx.fillStyle = color;
                ctx.shadowColor = shadowColor;
                ctx.shadowBlur = shadowBlur;
                ctx.fillRect(x * gridSize, y * gridSize, gridSize - 1, gridSize - 1);
                ctx.shadowBlur = 0; 
            }
            
            // --- LEADERBOARD FUNCTIONS (NEW) ---

            async function fetchLeaderboard() {
                leaderboardList.innerHTML = '<li>Loading Scores...</li>';
                try {
                    const response = await fetch('/api/scores?game=snake');
                    const data = await response.json();

                    if (data.success && data.scores.length > 0) {
                        leaderboardList.innerHTML = ''; // Clear loading message
                        data.scores.forEach((item, index) => {
                            const li = document.createElement('li');
                            const rank = index + 1;
                            const isCurrentUser = item.username === username;
                            
                            // Highlight the current user
                            if (isCurrentUser) {
                                li.style.fontWeight = 'bold';
                                li.style.backgroundColor = 'rgba(121, 166, 254, 0.1)'; 
                            }

                            li.innerHTML = `
                                <span class="rank">${rank}.</span>
                                <span class="username">${item.username}</span>
                                <span class="score-value">${item.score}</span>
                            `;
                            leaderboardList.appendChild(li);
                        });
                        
                        // Update personal best from the server's data
                        const personalRecord = data.scores.find(s => s.username === username);
                        if (personalRecord) {
                            localHighScore = personalRecord.score;
                            highScoreEl.textContent = localHighScore;
                            localStorage.setItem('snakeHighScore', localHighScore);
                        }

                    } else if (data.success) {
                        leaderboardList.innerHTML = '<li>No scores submitted yet. Be the first!</li>';
                    } else {
                         leaderboardList.innerHTML = '<li>Error loading leaderboard.</li>';
                    }
                } catch (error) {
                    console.error("Leaderboard fetch error:", error);
                    leaderboardList.innerHTML = '<li>Server error. Could not load scores.</li>';
                }
            }

            async function submitScore(finalScore) {
                if (finalScore <= 0) return; // Don't submit zero scores

                try {
                    const response = await fetch('/api/scores', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: username, score: finalScore, game: 'snake' })
                    });
                    const data = await response.json();

                    if (data.success) {
                        console.log("Score submitted successfully:", finalScore);
                        // If it's a new high score, update local storage/display
                        if (finalScore > localHighScore) {
                            localHighScore = finalScore;
                            highScoreEl.textContent = localHighScore;
                            localStorage.setItem('snakeHighScore', localHighScore);
                        }
                        // Refresh the global leaderboard to show the new score
                        fetchLeaderboard();
                    } else {
                        console.error("Failed to submit score:", data.message);
                    }
                } catch (error) {
                    console.error("Score submission failed:", error);
                }
            }
            
            // --- Game Functions ---
            
            function startGame() {
                if (gameLoop) clearInterval(gameLoop); 
                
                isGameOver = false;
                score = 0;
                currentScoreEl.textContent = score;
                snake = [{ x: 10, y: 10 }]; 
                velocity = { x: 1, y: 0 };
                gameSpeed = 150;
                nextDirection = null;
                
                placeFood();
                draw();

                gameLoop = setInterval(gameTick, gameSpeed);
                startButton.textContent = "Restart Game";
            }
            
            function placeFood() {
                let newFood;
                do {
                    newFood = {
                        x: Math.floor(Math.random() * tileCount),
                        y: Math.floor(Math.random() * tileCount)
                    };
                    
                    let onSnake = false;
                    for (const segment of snake) {
                        if (segment.x === newFood.x && segment.y === newFood.y) {
                            onSnake = true;
                            break;
                        }
                    }
                    if (!onSnake) {
                        food = newFood;
                        break;
                    }
                } while (true);
            }
            
            function update() {
                if (isGameOver) return;
                
                if (nextDirection) {
                    velocity = nextDirection;
                    nextDirection = null;
                }
                
                const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };
                
                // --- Collision Check ---
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    gameOver();
                    return;
                }
                
                for (const segment of snake) {
                    if (segment.x === head.x && segment.y === head.y) {
                        gameOver();
                        return;
                    }
                }
                
                snake.unshift(head);
                
                // --- Food Check ---
                if (head.x === food.x && head.y === food.y) {
                    score++;
                    currentScoreEl.textContent = score;
                    placeFood();
                    
                    if (gameSpeed > 50) {
                        gameSpeed -= 3; 
                        clearInterval(gameLoop);
                        gameLoop = setInterval(gameTick, gameSpeed);
                    }
                } else {
                    snake.pop();
                }
            }
            
            function draw() {
                // Clear Canvas
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw Food
                drawSquare(food.x, food.y, 'var(--color-food)', 15, 'var(--color-food)');
                
                // Draw Snake 
                snake.forEach((segment, index) => {
                    let color = 'var(--color-snake)';
                    let blur = 0;
                    
                    if (index === 0) {
                        color = '#66BB6A'; 
                        blur = 10;
                    }
                    
                    drawSquare(segment.x, segment.y, color, blur, color);
                });
            }
            
            function gameOver() {
                isGameOver = true;
                clearInterval(gameLoop);

                // 🚨 NEW: Submit the final score to the server
                submitScore(score);
                
                // Draw Game Over message
                ctx.fillStyle = 'white';
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER!", canvas.width / 2, canvas.height / 2);
                ctx.font = "18px Arial";
                ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 35);

                startButton.textContent = "Play Again";
            }
            
            function gameTick() {
                update();
                draw();
            }
            
            // --- Event Listeners (Controls) ---
            
            document.addEventListener('keydown', (e) => {
                // ... (Keyboard controls logic remains the same) ...
                let newVel = { x: velocity.x, y: velocity.y };
                
                switch (e.key) {
                    case 'ArrowUp': case 'w':
                        if (velocity.y === 0) newVel = { x: 0, y: -1 }; break;
                    case 'ArrowDown': case 's':
                        if (velocity.y === 0) newVel = { x: 0, y: 1 }; break;
                    case 'ArrowLeft': case 'a':
                        if (velocity.x === 0) newVel = { x: -1, y: 0 }; break;
                    case 'ArrowRight': case 'd':
                        if (velocity.x === 0) newVel = { x: 1, y: 0 }; break;
                    default: return;
                }

                if ((velocity.x * -1 !== newVel.x) || (velocity.y * -1 !== newVel.y)) {
                    nextDirection = newVel;
                }
            });

            // Mobile Controls
            document.getElementById('upBtn').addEventListener('click', () => {
                if (velocity.y === 0) nextDirection = { x: 0, y: -1 };
            });
            document.getElementById('downBtn').addEventListener('click', () => {
                if (velocity.y === 0) nextDirection = { x: 0, y: 1 };
            });
            document.getElementById('leftBtn').addEventListener('click', () => {
                if (velocity.x === 0) nextDirection = { x: -1, y: 0 };
            });
            document.getElementById('rightBtn').addEventListener('click', () => {
                if (velocity.x === 0) nextDirection = { x: 1, y: 0 };
            });

            startButton.addEventListener('click', startGame);
            
            // Initial Draw and Leaderboard Load
            function drawStartScreen() {
                snake = [{ x: 10, y: 10 }]; 
                food = { x: 15, y: 5 }; 
                draw();

                ctx.fillStyle = 'white';
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Press Start to Play", canvas.width / 2, canvas.height / 2);
            }
            
            drawStartScreen();
            fetchLeaderboard(); // Load scores immediately
        });
    </script>
</body>
</html>
