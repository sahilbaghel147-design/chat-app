<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aura Hub — Chat</title>

  <style>
    /* ---------- THEME & RESET ---------- */
    :root{
      --bg:#151521;
      --card:#232333;
      --muted:#9aa0b4;
      --accent:#5e6bfe;
      --accent-2:#6f7aff;
      --soft:#2a2a3d;
      --error:#ef4444;
      --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, var(--bg) 0%, #0f0f17 100%);
      color: #eef0f6;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* ---------- NAV ---------- */
    nav{
      display:flex;align-items:center;gap:18px;
      padding:14px 20px;
      background: linear-gradient(90deg, rgba(94,107,254,0.12), rgba(111,122,255,0.06));
      border-bottom:1px solid rgba(255,255,255,0.03);
      position:sticky;top:0;z-index:50;
    }
    .brand{font-size:20px;font-weight:700;color:var(--accent);margin-right:8px}
    .nav-links{display:flex;gap:14px;flex:1}
    .nav-links a{
      color: #e7e9f8;
      text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;
      transition: all .15s ease;
    }
    .nav-links a.active, .nav-links a:hover{
      background: linear-gradient(90deg,var(--accent) 0%, var(--accent-2) 100%);
      color:white;box-shadow:0 6px 18px rgba(94,107,254,0.12);
    }
    .nav-actions{display:flex;gap:10px;align-items:center}
    .logout-btn{
      background: #ff6b5f;padding:8px 12px;border-radius:8px;border:none;color:white;font-weight:700;cursor:pointer;
      box-shadow:0 6px 18px rgba(255,107,95,0.08);
    }

    /* ---------- LAYOUT ---------- */
    .page{
      display:flex;gap:18px;
      padding:20px;
      height:calc(100vh - 64px);
    }

    /* sidebar */
    .sidebar{
      width:260px;background:var(--card);border-radius:12px;padding:16px;border:1px solid rgba(255,255,255,0.03);
      display:flex;flex-direction:column;gap:12px;flex-shrink:0;overflow:auto;
    }
    .sidebar h3{color:var(--accent);font-size:16px;margin-bottom:6px}
    .user-list{display:flex;flex-direction:column;gap:8px}
    .user-item{
      display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:var(--glass);
    }
    .user-avatar{
      width:44px;height:44px;border-radius:10px;object-fit:cover;border:2px solid rgba(255,255,255,0.04)
    }
    .username-small{font-weight:700;color:#e9ecff}
    .user-status{font-size:12px;color:var(--muted)}

    /* main chat panel */
    .chat-panel{
      flex:1;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.03);
      background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
    }
    .panel-header{
      padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:space-between;
      background:linear-gradient(90deg, rgba(255,255,255,0.01), transparent);
    }
    .panel-title{font-size:18px;font-weight:800;color:var(--accent)}
    .panel-sub{color:var(--muted);font-size:13px}

    /* messages area */
    .messages{
      flex:1;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:12px;
      background-image: linear-gradient(transparent 0, rgba(255,255,255,0.01) 1px);
      background-size: 100% 48px;
    }

    .msg-row{display:flex;align-items:flex-end;gap:10px;max-width:80%}
    .msg-row.me{margin-left:auto;flex-direction:row-reverse}
    .msg-bubble{
      background:var(--soft);padding:12px 14px;border-radius:14px;color:var(--muted);line-height:1.3;
      box-shadow:0 6px 16px rgba(0,0,0,0.35);
    }
    .msg-bubble.me{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:white}
    .msg-meta{font-size:12px;color:var(--muted);margin-top:6px}

    .msg-avatar{width:40px;height:40px;border-radius:8px;object-fit:cover;border:2px solid rgba(255,255,255,0.03)}

    /* input bar */
    .input-bar{
      padding:12px;border-top:1px solid rgba(255,255,255,0.03);background:linear-gradient(90deg, transparent, rgba(255,255,255,0.01));
      display:flex;gap:10px;align-items:center;
    }
    .input-field{
      flex:1;display:flex;gap:8px;align-items:center;background:var(--card);padding:10px;border-radius:999px;border:1px solid rgba(255,255,255,0.02)
    }
    .input-field input[type="text"]{
      flex:1;background:transparent;border:0;outline:0;color:var(--muted);padding:8px;font-size:15px;
    }
    .btn-send{
      background:linear-gradient(90deg,var(--accent),var(--accent-2));border:none;color:white;padding:10px 18px;border-radius:12px;font-weight:800;cursor:pointer;
      box-shadow:0 8px 26px rgba(94,107,254,0.12);
    }

    /* small screens */
    @media (max-width:900px){
      .page{padding:12px;flex-direction:column;height:calc(100vh - 64px)}
      .sidebar{width:100%;height:120px;order:2;overflow-x:auto;display:flex;flex-direction:row;align-items:center}
      .user-list{flex-direction:row;gap:10px}
      .chat-panel{order:1;height:calc(100vh - 240px)}
      .messages{padding:12px}
    }
  </style>
</head>
<body>
  <nav>
    <div class="brand">Aura Hub</div>
    <div class="nav-links" role="navigation" aria-label="Main">
      <a href="/index.html">Home</a>
      <a href="/chat.html" class="active">Chat</a>
      <a href="/profile.html">Profile</a>
      <a href="/games.html">Games</a>
      <a href="/videos.html">Videos</a>
      <a href="/about.html">About</a>
    </div>
    <div class="nav-actions">
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
  </nav>

  <div class="page" role="main">
    <!-- LEFT: sidebar -->
    <aside class="sidebar" aria-label="Online users">
      <h3>Online Users</h3>
      <div id="onlineUsers" class="user-list" aria-live="polite">
        <!-- dynamic -->
      </div>
    </aside>

    <!-- CENTER: chat panel -->
    <section class="chat-panel" aria-label="Chat area">
      <div class="panel-header">
        <div>
          <div class="panel-title">Aura Hub — Live Chat</div>
          <div class="panel-sub" id="panelSub">Connected as <strong id="meName">Guest</strong></div>
        </div>
        <div id="statusDot" aria-hidden="true" style="font-weight:700;color:var(--muted)">●</div>
      </div>

      <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions">
        <!-- messages appear here -->
      </div>

      <div class="input-bar" role="region" aria-label="Message input">
        <div class="input-field">
          <input id="messageInput" autocomplete="off" type="text" placeholder="Type your message..." aria-label="Type your message">
        </div>
        <button id="sendBtn" class="btn-send" aria-label="Send message">Send</button>
      </div>
    </section>
  </div>

  <!-- socket.io client (server should serve this path) -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ---------- Setup ----------
    const username = localStorage.getItem('username') || 'Guest';
    const avatar = localStorage.getItem('profilePicture') || '/uploads/default_avatar.jpg';

    const messagesEl = document.getElementById('messages');
    const onlineUsersEl = document.getElementById('onlineUsers');
    const sendBtn = document.getElementById('sendBtn');
    const msgInput = document.getElementById('messageInput');
    const meNameEl = document.getElementById('meName');
    const statusDot = document.getElementById('statusDot');

    meNameEl.textContent = username;

    // helper: safe image src (if 404, replace with default)
    function safeImg(imgEl, fallback='/uploads/default_avatar.jpg'){
      imgEl.addEventListener('error', ()=> { imgEl.src = fallback; });
    }

    function timeNow(){
      const d=new Date();
      return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }

    // ---------- socket connect ----------
    let socket;
    try {
      socket = io(); // will throw if /socket.io not available
    } catch (e) {
      console.warn('Socket.IO client failed to initialize', e);
    }

    if (socket) {
      statusDot.textContent = '● ONLINE';
      statusDot.style.color = 'limegreen';
      // emit join event (server expected to listen)
      socket.emit('join', { username, avatar });

      // receive whole users list
      socket.on('updateUsers', (users) => {
        onlineUsersEl.innerHTML = '';
        users.forEach(u => {
          const div = document.createElement('div');
          div.className = 'user-item';
          const img = document.createElement('img');
          img.className = 'user-avatar'; img.src = u.avatar || '/uploads/default_avatar.jpg';
          safeImg(img);
          const info = document.createElement('div');
          const name = document.createElement('div'); name.className='username-small'; name.textContent = u.username;
          const st = document.createElement('div'); st.className='user-status'; st.textContent = u.status || 'online';
          info.appendChild(name); info.appendChild(st);
          div.appendChild(img); div.appendChild(info);
          onlineUsersEl.appendChild(div);
        });
      });

      // incoming chat message
      socket.on('message', (data) => {
        appendMessage(data);
      });

      // handle disconnect/reconnect visuals
      socket.on('disconnect', ()=> {
        statusDot.textContent = '● DISCONNECTED';
        statusDot.style.color = 'orangered';
      });
      socket.on('connect', ()=> {
        statusDot.textContent = '● ONLINE';
        statusDot.style.color = 'limegreen';
        // re-join after reconnect
        socket.emit('join', { username, avatar });
      });
    } else {
      // if socket not available, show offline status
      statusDot.textContent = '● OFFLINE';
      statusDot.style.color = 'orangered';
      // Inform user visually
      const warn = document.createElement('div');
      warn.style.color='#ffb3b3';
      warn.style.padding='8px 12px';
      warn.style.borderRadius='8px';
      warn.style.background='rgba(255,80,80,0.03)';
      warn.textContent = 'Real-time chat currently not available (socket connection missing).';
      messagesEl.appendChild(warn);
    }

    // ---------- UI helpers ----------
    function appendMessage({ username: from, text, avatar: av, time }) {
      const row = document.createElement('div');
      row.className = 'msg-row ' + (from === username ? 'me' : 'them');

      const img = document.createElement('img'); img.className='msg-avatar';
      img.src = av || '/uploads/default_avatar.jpg';
      safeImg(img);

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble ' + (from === username ? 'me' : '');
      bubble.innerHTML = `<div style="font-weight:700;margin-bottom:6px">${escapeHtml(from)}</div>
                          <div>${escapeHtml(text)}</div>
                          <div class="msg-meta">${time || timeNow()}</div>`;

      if (from === username) {
        row.classList.add('me');
      }
      row.appendChild(img);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      // auto scroll
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // escape html for safety
    function escapeHtml(str){
      if(!str) return '';
      return String(str).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});
    }

    // ---------- send logic ----------
    function sendMsg(){
      const text = msgInput.value.trim();
      if(!text) return;
      const payload = { username, text, avatar, time: timeNow() };

      // locally show immediately
      appendMessage(payload);

      // send to server
      if(socket && socket.connected){
        socket.emit('chatMessage', payload);
      } else {
        // show small notice that message wasn't sent to server
        // (still retained locally to show user)
        console.warn('Not connected - message queued locally');
      }
      msgInput.value = '';
      msgInput.focus();
    }

    sendBtn.addEventListener('click', sendMsg);
    msgInput.addEventListener('keypress', (e)=> { if(e.key === 'Enter'){ e.preventDefault(); sendMsg(); } });

    // logout
    document.getElementById('logoutBtn').addEventListener('click', ()=>{
      localStorage.removeItem('username');
      localStorage.removeItem('profilePicture');
      // redirect to login
      window.location.href = '/login.html';
    });

    // small accessibility: focus input on load
    window.addEventListener('load', ()=> { setTimeout(()=> msgInput.focus(), 300); });

  </script>
</body>
</html>
