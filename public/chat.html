<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Chat - Realtime</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-dark: #0d0f1a;
      --bg-card: #1b1e2f;
      --accent: #5e6bfe;
      --accent-hover: #4656dc;
      --text-light: #f5f5f5;
      --text-dim: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 260px;
      background: var(--bg-card);
      border-right: 1px solid #2a2d3e;
      display: flex;
      flex-direction: column;
      transition: 0.3s;
    }

    #sidebar h2 {
      text-align: center;
      padding: 20px 0;
      color: var(--accent);
      border-bottom: 1px solid #2a2d3e;
    }

    #onlineUsersList {
      list-style: none;
      overflow-y: auto;
      flex-grow: 1;
    }

    #onlineUsersList li {
      padding: 14px 20px;
      border-bottom: 1px solid #2a2d3e;
      cursor: pointer;
      transition: 0.3s;
    }

    #onlineUsersList li:hover,
    #onlineUsersList li.active {
      background: var(--accent);
      color: white;
    }

    /* Chat Section */
    #chatSection {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #chatHeader {
      background: var(--bg-card);
      padding: 15px 20px;
      border-bottom: 1px solid #2a2d3e;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #messageDisplayArea {
      flex-grow: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin: 8px 0;
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      line-height: 1.4;
      font-size: 0.95rem;
    }

    .sender {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 0;
    }

    .receiver {
      align-self: flex-start;
      background: #262a3f;
      border-bottom-left-radius: 0;
    }

    /* Input Area */
    #inputArea {
      display: flex;
      align-items: center;
      padding: 10px;
      background: var(--bg-card);
      border-top: 1px solid #2a2d3e;
    }

    #messageInput {
      flex: 1;
      background: #141622;
      color: var(--text-light);
      border: none;
      padding: 12px 15px;
      border-radius: 8px;
      outline: none;
      font-size: 1rem;
    }

    #sendMessageBtn,
    #attachFileBtn {
      background: var(--accent);
      color: white;
      border: none;
      margin-left: 8px;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    #sendMessageBtn:hover,
    #attachFileBtn:hover {
      background: var(--accent-hover);
    }

    #logoutBtn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
    }

    /* File link */
    a.file-link {
      color: #ffd740;
      text-decoration: underline;
      display: block;
      margin-top: 4px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      #sidebar {
        position: absolute;
        left: -260px;
        top: 0;
        bottom: 0;
        z-index: 10;
      }

      #sidebar.active {
        left: 0;
      }

      #toggleSidebar {
        display: block;
      }

      #chatHeader {
        display: flex;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h2>🟢 Online Users</h2>
    <ul id="onlineUsersList"></ul>
  </aside>

  <section id="chatSection">
    <div id="chatHeader">
      <button id="toggleSidebar" style="display:none;background:none;border:none;color:white;font-size:1.4em;">
        <i class="fas fa-bars"></i>
      </button>
      <span id="currentChatRecipient">Select a user to chat</span>
      <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
    </div>

    <div id="messageDisplayArea"></div>

    <div id="inputArea">
      <input type="file" id="fileInput" hidden />
      <button id="attachFileBtn"><i class="fas fa-paperclip"></i></button>
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button id="sendMessageBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
  </section>

  <script>
    const socket = io();
    const username = localStorage.getItem("username");
    if (!username) window.location.href = "/login.html";

    // Register user
    socket.emit("registerUser", username);

    const onlineUsersList = document.getElementById("onlineUsersList");
    const messageDisplayArea = document.getElementById("messageDisplayArea");
    const messageInput = document.getElementById("messageInput");
    const sendMessageBtn = document.getElementById("sendMessageBtn");
    const attachFileBtn = document.getElementById("attachFileBtn");
    const fileInput = document.getElementById("fileInput");
    const currentChatRecipient = document.getElementById("currentChatRecipient");
    const sidebar = document.getElementById("sidebar");
    const toggleSidebar = document.getElementById("toggleSidebar");
    const logoutBtn = document.getElementById("logoutBtn");

    let currentRecipient = null;

    toggleSidebar.addEventListener("click", () => {
      sidebar.classList.toggle("active");
    });

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("username");
      window.location.href = "/login.html";
    });

    // Update online users
    socket.on("updateUserList", (users) => {
      onlineUsersList.innerHTML = "";
      users.forEach((user) => {
        if (user !== username) {
          const li = document.createElement("li");
          li.textContent = user;
          li.onclick = () => selectRecipient(user, li);
          onlineUsersList.appendChild(li);
        }
      });
    });

    function selectRecipient(user, el) {
      currentRecipient = user;
      document
        .querySelectorAll("#onlineUsersList li")
        .forEach((li) => li.classList.remove("active"));
      el.classList.add("active");
      currentChatRecipient.textContent = "Chatting with: " + user;
      messageDisplayArea.innerHTML = "";
      socket.emit("loadChat", { user1: username, user2: user });
      if (window.innerWidth < 768) sidebar.classList.remove("active");
    }

    socket.on("chatHistory", (msgs) => {
      messageDisplayArea.innerHTML = "";
      msgs.forEach((m) => displayMessage(m));
      scrollToBottom();
    });

    socket.on("privateMessage", (msg) => {
      if (
        msg.sender === currentRecipient ||
        msg.receiver === currentRecipient
      ) {
        displayMessage(msg);
        scrollToBottom();
      }
    });

    function scrollToBottom() {
      messageDisplayArea.scrollTop = messageDisplayArea.scrollHeight;
    }

    sendMessageBtn.onclick = () => sendMessage();
    messageInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!currentRecipient) return alert("Select a user to chat first");
      if (!text) return;
      const msg = { sender: username, receiver: currentRecipient, text };
      socket.emit("privateMessage", msg);
      messageInput.value = "";
    }

    attachFileBtn.onclick = () => fileInput.click();
    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append("chatFile", file);

      const res = await fetch("/upload", { method: "POST", body: formData });
      const data = await res.json();
      if (data.success) {
        const msg = {
          sender: username,
          receiver: currentRecipient,
          text: `[File shared: ${data.originalName}]`,
          fileUrl: data.fileUrl,
          mimeType: data.mimeType,
          originalName: data.originalName,
        };
        socket.emit("privateMessage", msg);
      } else {
        alert("File upload failed: " + data.message);
      }
      fileInput.value = "";
    };

    function displayMessage(m) {
      const div = document.createElement("div");
      div.classList.add("message");
      div.classList.add(m.sender === username ? "sender" : "receiver");

      const text = document.createElement("p");
      text.textContent = m.text;
      div.appendChild(text);

      if (m.fileData || m.fileUrl) {
        const link = document.createElement("a");
        link.href = m.fileData || m.fileUrl;
        link.target = "_blank";
        link.textContent = "📎 " + (m.originalName || "File");
        link.className = "file-link";
        div.appendChild(link);
      }

      messageDisplayArea.appendChild(div);
    }
  </script>
</body>
</html>
