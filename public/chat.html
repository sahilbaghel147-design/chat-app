<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura Hub - Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #5e6bfe, #4a59e6);
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-weight: bold;
      font-size: 1.2em;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }
    header img {
      width: 35px; height: 35px;
      border-radius: 50%;
      border: 2px solid white;
    }

    /* Chat area */
    #chatBox {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #181828;
      display: flex;
      flex-direction: column;
    }

    .msg-row {
      display: flex;
      margin: 6px 0;
      align-items: flex-end;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 15px;
      max-width: 70%;
      font-size: 0.95em;
      line-height: 1.4;
    }
    .me {
      background: #5e6bfe;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 3px;
    }
    .other {
      background: #2c2c3e;
      color: #eee;
      margin-right: auto;
      border-bottom-left-radius: 3px;
    }
    .username {
      font-size: 0.75em;
      opacity: 0.7;
      margin-bottom: 3px;
    }

    /* Input area */
    #inputArea {
      display: flex;
      padding: 10px;
      background: #1c1c2c;
      border-top: 1px solid #333;
    }
    #messageInput {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: none;
      outline: none;
      background: #2a2a3d;
      color: white;
      font-size: 1em;
    }
    #sendButton {
      background: #5e6bfe;
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      margin-left: 8px;
      color: white;
      font-size: 1.2em;
      cursor: pointer;
      transition: 0.2s;
    }
    #sendButton:hover {
      background: #4a59e6;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <header>
    <img src="https://i.pravatar.cc/100?u=me" alt="User Avatar"/>
    Aura Hub - Chat
  </header>

  <div id="chatBox"></div>

  <div id="inputArea">
    <input type="text" id="messageInput" placeholder="Type your message..."/>
    <button id="sendButton">➤</button>
  </div>

  <script>
    const socket = io();
    const username = localStorage.getItem("username") || "Guest";

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    sendButton.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      socket.emit("chatMessage", { sender: username, text });
      messageInput.value = "";
    }

    socket.on("message", (msg) => {
      const row = document.createElement("div");
      row.classList.add("msg-row");

      const bubble = document.createElement("div");
      bubble.classList.add("msg");

      if (msg.sender === username) {
        bubble.classList.add("me");
        bubble.innerHTML = `<div class="username">You</div>${msg.text}`;
      } else {
        bubble.classList.add("other");
        bubble.innerHTML = `<div class="username">${msg.sender}</div>${msg.text}`;
      }

      row.appendChild(bubble);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
