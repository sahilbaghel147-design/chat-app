<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura Hub - Chat</title>
  
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <link rel="stylesheet" href="style.css"> 
  
  <style>
    /* ⚠️ NOTE: This style block is minimized. Please ensure your external style.css 
       contains the complete Dark Mode/Layout CSS from our previous successful fixes. */
    body {
      background: #1a1a2e;
      color: #f0f0f0;
      font-family: "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      background: #3f51b5;
      padding: 12px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .chat-container {
      flex: 1;
      display: flex;
      height: calc(100vh - 50px);
      overflow: hidden;
    }
    .sidebar {
      width: 250px;
      background: #2c3e50;
      padding: 15px;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #181828;
    }
    #chatBox {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #181828;
    }
    /* Input Area */
    #inputArea {
      display: flex;
      padding: 10px 20px;
      background: #2c3e50;
      border-top: 1px solid #333;
      flex-shrink: 0;
    }
    #messageInput {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: none;
      background: #3a3a5a;
      color: white;
    }
    #sendButton {
      background: #5e6bfe;
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      margin-left: 8px;
      color: white;
      font-size: 1.2em;
      cursor: pointer;
    }
    /* Message Bubbles - add your previous bubble styles here */
  </style>
</head>
<body>
  <nav>
    <a href="/index.html">Home</a>
    <a href="/chat.html" class="active">Chat</a>
    <a href="/profile.html">Profile</a>
    <a href="/games.html">Games</a>
    <a href="/videos.html">Videos</a>
    <a href="/about.html">About</a>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <div class="chat-container">
    <div class="sidebar">
      <h3>🟢 Online Users</h3>
      <div id="usersList"></div>
    </div>

    <div class="chat-area">
        <h2 id="chatRecipientHeader" style="padding: 15px; border-bottom: 1px solid #333; background: #2c3e50;">Select a User to Chat</h2>
      <div id="chatBox"></div>
      <div id="inputArea">
        <input type="text" id="messageInput" placeholder="Type your message..."/>
        <button id="sendButton">➤</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let username = localStorage.getItem("username") || "Guest";
    let currentRecipient = null; // 🚨 NEW STATE VARIABLE

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const usersList = document.getElementById("usersList");
    const chatRecipientHeader = document.getElementById("chatRecipientHeader");


    if (username === "Guest") {
        window.location.href = "/login.html";
    }

    sendButton.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    document.querySelector('.logout-btn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = "/login.html";
    });

    // --- Core Functions ---

    function startChat(recipient) {
        currentRecipient = recipient;
        chatRecipientHeader.textContent = `Chatting with: ${recipient}`;
        chatBox.innerHTML = ''; // Clear chat area
        // Enable input
        messageInput.disabled = false;
        sendButton.disabled = false;
        
        // FIX: Add logic to fetch chat history here (if implemented on server)
        // socket.emit("loadChatHistory", { user1: username, user2: recipient }); 
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !currentRecipient) {
          if (!currentRecipient) alert("Please select an online user first.");
          return;
      }
      
      // 🚨 FINAL FIX: Emit privateMessage with correct recipient
      socket.emit("privateMessage", { 
          sender: username, 
          receiver: currentRecipient, 
          text: text 
      }); 
      
      // Optimistic rendering (show my own message immediately)
      addMessage({ sender: username, text: text });
      messageInput.value = "";
    }

    function addMessage(msg) {
      const row = document.createElement("div");
      row.classList.add("msg-row");

      const bubble = document.createElement("div");
      bubble.classList.add("msg");

      if (msg.sender === username) {
        bubble.classList.add("me");
        bubble.innerHTML = `<div>You</div>${msg.text}`;
      } else {
        bubble.classList.add("other");
        bubble.innerHTML = `<div>${msg.sender}</div>${msg.text}`;
      }

      row.appendChild(bubble);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- Socket Logic ---
    socket.emit("newUser", username); // Register user

    socket.on("message", (msg) => {
        // This is for Global Chat. Since you are building Private Chat, you might not need this.
        // If your server sends private messages using a different event name (like 'newPrivateMessage'), 
        // you should add that listener here.
        // For now, it will display the global chat if your server sends 'message'.
        addMessage(msg);
    });

    socket.on("updateUsers", (users) => { // Array of usernames
      usersList.innerHTML = "";
      users.forEach(u => {
        if (u !== username) {
            const div = document.createElement("div");
            div.classList.add("user");
            div.textContent = u;
            // 🔑 Start chat on user click
            div.onclick = () => startChat(u); 
            usersList.appendChild(div);
        }
      });
    });
    
    // Listener for private messages coming in
    socket.on("privateMessage", (msg) => {
        // Display only if it's the current active chat
        if (msg.sender === currentRecipient || msg.receiver === currentRecipient) {
             addMessage(msg);
        }
    });

  </script>
</body>
</html>
