<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatHub - Chat</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .sidebar {
            width: 250px;
            height: 100%;
            position: fixed;
            top: 0;
            left: -250px; 
            background-color: #2c3e50;
            padding-top: 60px;
            transition: 0.3s;
            z-index: 10;
            color: white;
        }
        .sidebar.open {
            left: 0;
        }
        /* ... (Add other necessary CSS styles) ... */
    </style>
</head>
<body>

    <div class="header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h2 id="main-welcome-text" style="color:white;"></h2> 
        <button onclick="logout()" class="logout-btn">Logout</button>
    </div>

    <div id="sidebar" class="sidebar">
        <h3 style="padding: 15px; text-align: center; border-bottom: 1px solid #34495e;" id="sidebar-welcome-text"></h3>
        <a href="/">Home</a>
        <a href="/chat.html">Chat</a>
        <a href="/profile.html">Profile</a>
        <a href="/games.html">Games</a>
        <a href="/videos.html">Videos</a>
        <h4 style="padding: 15px; border-top: 1px solid #34495e;">ONLINE USERS</h4>
        <ul id="online-users" class="online-user-list">
            </ul>
    </div>

    <div id="content" class="content">
        <h1>Select a user to start chatting</h1>
        <div id="chat-box" style="display: none;">
            <h2>Chatting with: <span id="receiver-name"></span></h2>
            <div id="messages" class="chat-window">
                </div>
            <div class="message-input-area">
                <input type="text" id="message-input" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

<script>
    // --- UTILITIES & AUTHENTICATION ---
    const socket = io();

    function logout() {
        // FIX: Clear all local storage data completely before redirecting
        localStorage.clear(); 
        window.location.href = "/login.html";
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('content').classList.toggle('shifted');
    }

    // --- ON LOAD LOGIC (FIXED) ---
    let username = localStorage.getItem('username');

    // FIX: Strong validation against null, empty string, or the literal string "undefined"
    if (!username || username === "undefined" || username.trim() === "") {
        console.log("Invalid username found. Clearing data and redirecting to login.");
        localStorage.clear(); 
        window.location.href = "/login.html";
    } else {
        username = username.trim(); 
        
        // Update UI with the valid username
        const mainWelcome = document.getElementById('main-welcome-text'); 
        if (mainWelcome) {
            mainWelcome.textContent = `Welcome, ${username}!`; 
        }

        const sidebarWelcome = document.getElementById('sidebar-welcome-text'); 
        if (sidebarWelcome) {
            // Fixes 'Hello, undefined!'
            sidebarWelcome.textContent = `Hello, ${username}!`; 
        }
        
        // Register user with Socket.IO
        socket.emit('register', username); 
    }

    // ... (rest of the Socket.IO and Chat Logic functions) ...

</script>
</body>
</html>
