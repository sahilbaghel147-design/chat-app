<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login - Aura Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
  :root {
      --bg-dark: #1e1e2f;
      --bg-card: #2c2c3e;
      --color-primary: #5e6bfe;
      --color-text: #f0f0f0;
      --color-error: #ef4444;
  }

  body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--bg-dark);
      color: var(--color-text);
      font-family: 'Arial', sans-serif;
      background-image: radial-gradient(circle, #333 1px, transparent 1px);
      background-size: 30px 30px;
  }

  .login-container {
      background: var(--bg-card);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      width: 350px;
      text-align: center;
      border: 1px solid #444;
      animation: fadeIn 0.8s ease-out;
  }

  h2 {
      margin-bottom: 30px;
      color: var(--color-primary);
      font-size: 2em;
      font-weight: 700;
  }

  .input-group { 
      position: relative; 
      margin-bottom: 25px; 
      width: 100%;
  }
  input {
      width: 100%; 
      padding: 12px 12px 12px 40px; 
      border: 1px solid #444; 
      background: #282828; 
      border-radius: 8px;
      color: var(--color-text); 
      font-size: 16px; 
      transition: border-color 0.3s;
      box-sizing: border-box;
  }
  input:focus { 
      border-color: var(--color-primary); 
      box-shadow: 0 0 5px rgba(94, 107, 254, 0.5); 
  }

  .input-group i {
      position: absolute; 
      left: 15px; 
      top: 50%; 
      transform: translateY(-50%);
      color: #888; 
      transition: color 0.3s;
  }
  input:focus + i { color: var(--color-primary); }

  #loginButton {
      width: 100%; 
      padding: 14px; 
      background: var(--color-primary); 
      border: none;
      color: white; 
      font-size: 1.1em; 
      font-weight: bold; 
      cursor: pointer;
      border-radius: 8px; 
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(94, 107, 254, 0.4);
  }
  #loginButton:hover {
      background: #4a59e6; 
      transform: translateY(-1px);
  }

  #statusMessage {
      margin-top: 15px;
      font-size: 1em;
      min-height: 20px;
      font-weight: 500;
      color: var(--color-error);
  }

  .signup-link, .forgot-link {
      margin-top: 15px; 
      display: block; 
      color: #aaa; 
      text-decoration: none; 
      font-size: 0.9em;
  }
  .signup-link:hover, .forgot-link:hover {
      color: var(--color-primary);
      text-decoration: underline;
  }

  @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
  }
  </style>
</head>
<body>
  <div class="login-container">
    <h2><i class="fas fa-lock"></i> User Login</h2>
    
    <div class="input-group">
        <input type="text" id="usernameInput" placeholder="Username" required>
        <i class="fas fa-user"></i>
    </div>
    
    <div class="input-group">
        <input type="password" id="passwordInput" placeholder="Password" required>
        <i class="fas fa-key"></i>
    </div>
    
    <button id="loginButton" onclick="handleLogin()">
        <i class="fas fa-sign-in-alt"></i> Login
    </button>
    
    <div id="statusMessage"></div>
    
    <a class="signup-link" href="/signup.html">Don't have an account? Signup</a>
    <a class="signup-link" href="/forgot.html">Forgot Password?</a>
  </div>

  <script>
    async function handleLogin() {
      const username = document.getElementById("usernameInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();
      const statusDiv = document.getElementById("statusMessage");
      const loginButton = document.getElementById("loginButton");

      statusDiv.style.color = "yellow";
      statusDiv.textContent = "Logging in...";
      loginButton.disabled = true;

      if (!username || !password) {
        statusDiv.style.color = "red";
        statusDiv.textContent = "Please enter username and password";
        loginButton.disabled = false;
        return;
      }

      try {
        // ✅ FIXED: Correct Render-compatible route
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        if (!res.ok) {
          throw new Error("Network response was not ok");
        }

        const data = await res.json();

        if (data.success) {
          statusDiv.style.color = "lightgreen";
          statusDiv.textContent = "Login successful! Redirecting...";
          
          // ✅ Save username locally
          localStorage.setItem("username", data.username || username);

          setTimeout(() => {
            window.location.href = "/chat.html";
          }, 500);
        } else {
          statusDiv.style.color = "red";
          statusDiv.textContent = data.message || "Invalid username or password";
        }

      } catch (err) {
        console.error("Login Error:", err);
        statusDiv.style.color = "red";
        // ✅ Show better error feedback
        statusDiv.textContent = "Error connecting to server. Please wait and try again.";
      } finally {
        loginButton.disabled = false;
      }
    }
  </script>
</body>
</html>
