<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App - Live Chat</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-main: #f0f2f5;         /* Light Gray Background */
            --bg-sidebar: #ffffff;      /* White Sidebar */
            --bg-component: #e9ecef;    /* Light component background */
            --color-primary: #007bff;   /* Blue Accent */
            --color-text: #212529;      /* Dark Text */
            --color-secondary: #6c757d; /* Gray Text */
            --color-border: #dee2e6;    /* Light Border */
            --color-error: #dc3545;     /* Red Error */
        }

        body {
            background: var(--bg-main);
            color: var(--color-text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: var(--color-primary);
        }

        /* 2. Main Layout (Sidebar & Content) */
        #sidebar {
            width: 250px; 
            position: fixed;
            top: 0;
            left: 0; 
            height: 100vh;
            z-index: 1000;
            background: var(--bg-sidebar); 
            color: var(--color-text);
            padding: 20px 0;
            transition: all 0.3s;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        /* JS द्वारा जोड़ा गया क्लास: साइडबार को छिपाता है (डिफ़ॉल्ट रूप से यह खुला है) */
        #sidebar.active { 
            left: -250px; 
        }

        #content {
            margin-left: 250px; 
            padding: 20px;
            min-height: 100vh;
            transition: all 0.3s;
            width: calc(100% - 250px);
            background: var(--bg-main);
        }

        /* JS द्वारा जोड़ा गया क्लास: कंटेंट को पूरी चौड़ाई देता है */
        #content.active {
            margin-left: 0; 
            width: 100%;
        }

        /* Sidebar Header & Links */
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--color-border);
        }

        .sidebar-header h3 a {
            color: var(--color-primary); 
            font-size: 1.5em;
            font-weight: 700;
        }
        
        #dismiss { /* Close Button */
            font-size: 1.5em;
            cursor: pointer;
            color: var(--color-secondary);
        }
        #dismiss:hover {
            color: var(--color-error);
        }

        .list-unstyled {
            list-style: none;
            padding: 0;
        }

        #sidebar a {
            color: var(--color-secondary); 
            display: flex;
            align-items: center;
            padding: 12px 20px;
            font-size: 1em;
            transition: background 0.2s;
        }

        #sidebar a i {
            margin-right: 15px;
            width: 18px;
            text-align: center;
        }

        #sidebar a:hover,
        #sidebar li.active a {
            color: var(--color-text);
            background: var(--bg-component); 
            border-left: 5px solid var(--color-primary);
        }

        .online-users-list {
            padding: 20px;
            border-top: 1px solid var(--color-border);
            margin-top: 20px;
        }
        
        .online-user-item {
            padding: 10px 0; /* Increased padding */
            cursor: pointer;
            color: var(--color-secondary);
            display: flex; /* For icon alignment */
            align-items: center;
        }
        
        /* AI BOT SPECIAL STYLE */
        #ai-bot-user {
            font-weight: bold;
            color: #28a745; /* Green color for bot */
            background-color: #f0fff0;
            border-radius: 5px;
            padding: 10px 15px;
            border: 1px solid #c3e6cb;
            margin-bottom: 5px;
        }
        #ai-bot-user:hover {
            background-color: #e2ffe2;
        }

        .online-user-item:hover, .online-user-item.active { 
            color: var(--color-primary);
            font-weight: bold;
            background-color: var(--bg-component);
            border-radius: 5px;
        }

        /* 3. Top Navbar */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 25px;
        }

        .welcome-text {
            font-weight: 600;
            color: var(--color-primary);
            margin-right: 15px;
        }

        .btn-danger {
            background-color: var(--color-error);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #sidebarCollapse {
            background: var(--color-primary);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            transition: background 0.2s;
        }
        #sidebarCollapse:hover {
            background: #0056b3;
        }

        /* 4. Chat Interface Specifics */
        .chat-wrapper {
            display: flex;
            flex-direction: column;
            /* 100px = top-navbar height + padding */
            height: calc(100vh - 100px); 
            background: var(--bg-sidebar); 
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 15px;
        }
        
        .message-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 10px;
            display: flex; 
            flex-direction: column;
        }

        /* Message Bubble Styling */
        .message {
            max-width: 65%;
            padding: 10px 15px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            margin-bottom: 10px;
            box-shadow: 0 1px 1px rgba(0,0,0,0.05);
        }

        .message.sender {
            align-self: flex-end; 
            background-color: var(--color-primary); 
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px; 
        }

        .message.receiver {
            align-self: flex-start; 
            background-color: var(--bg-component);
            color: var(--color-text);
            margin-right: auto;
            border-bottom-left-radius: 4px; 
        }
        
        .message-input-area {
            display: flex;
            padding: 5px;
            background-color: var(--bg-component);
            border-radius: 25px;
            align-items: center;
        }

        #messageInput {
            flex-grow: 1;
            padding: 10px 15px;
            border: none;
            background: transparent;
            color: var(--color-text);
            outline: none;
        }

        .btn-send, .btn-attach {
            background: none;
            border: none;
            color: var(--color-primary);
            cursor: pointer;
            font-size: 1.3em;
            padding: 5px 10px;
            transition: color 0.2s;
        }
        .btn-send:hover, .btn-attach:hover {
            color: #0056b3;
        }

        /* 5. Mobile Responsiveness */
        @media (max-width: 768px) {
            
            #sidebar {
                left: -250px; 
                position: absolute; 
            }
            
            #sidebar.active { 
                left: 0; 
            }
            
            #content {
                margin-left: 0;
                width: 100%;
                padding: 10px;
            }

            #content.active {
                margin-left: 0; 
                width: 100%;
            }
            
            .message {
                max-width: 85%;
            }
        }
    </style>
    </head>
<body>

<div id="sidebar"> 
    <div class="sidebar-header">
        <a href="/index.html"><h3>Chat App</h3></a>
        <div id="dismiss"><i class="fas fa-times"></i></div>
    </div>
    <ul class="list-unstyled components">
        <li>
            <a href="/index.html"><i class="fas fa-home"></i> Home</a>
        </li>
        <li class="active"> 
            <a href="/chat.html"><i class="fas fa-comment-alt"></i> Chat</a>
        </li>
        <li>
            <a href="/games.html"><i class="fas fa-gamepad"></i> Games</a>
        </li>
        <li>
            <a href="/videos.html"><i class="fas fa-video"></i> Videos</a>
        </li>
        <li>
            <a href="/about.html"><i class="fas fa-info-circle"></i> About</a>
        </li>
    </ul>
    
    <div class="online-users-list">
        <h4>Online Users</h4>
        <ul id="onlineUsersList">
            </ul>
    </div>
</div>
<div id="content">
    
    <nav class="top-navbar">
        <div class="navbar-left">
            <button type="button" id="sidebarCollapse" class="btn btn-dark">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <div class="navbar-right">
             <span class="welcome-text" id="welcomeMessage">Welcome, user!</span>
             <button id="logoutBtn" class="btn btn-danger">Logout</button>
        </div>
    </nav>

    <div class="chat-wrapper">
        <h2 id="currentChatRecipient">Select a user or Aura Bot 🤖 to chat</h2>

        <div id="messageDisplayArea" class="message-area">
            </div>

        <div class="message-input-area">
            
            <input type="file" id="fileInput" style="display: none;">
            
            <button id="attachFileBtn" class="btn-attach" title="Attach File">
                <i class="fas fa-paperclip"></i>
            </button>

            <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
            
            <button id="sendMessageBtn" class="btn-send">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

    </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- CONSTANTS ---
        const username = localStorage.getItem('username');
        const AI_BOT_USERNAME = "Aura Bot 🤖"; // Define bot's username

        // --- ELEMENTS ---
        const sidebarCollapse = document.getElementById('sidebarCollapse');
        const dismiss = document.getElementById('dismiss');
        const logoutBtn = document.getElementById('logoutBtn');
        const welcomeMessageEl = document.getElementById('welcomeMessage');
        const onlineUsersList = document.getElementById('onlineUsersList');
        const currentChatRecipientEl = document.getElementById('currentChatRecipient');
        const messageDisplayArea = document.getElementById('messageDisplayArea');
        const messageInput = document.getElementById('messageInput');
        const sendMessageBtn = document.getElementById('sendMessageBtn');
        const attachFileBtn = document.getElementById('attachFileBtn');
        const fileInput = document.getElementById('fileInput');

        let currentChatRecipient = null;
        const socket = io();


        // --- UTILITY FUNCTIONS ---

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('content');
            if (sidebar && content) {
                sidebar.classList.toggle('active');
                content.classList.toggle('active'); 
            }
        }
        
        function displayMessage(sender, text, type, fileDir, fileMimeType, originalName) {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${type}`;
            
            if (fileDir) {
                // Handle File Message
                let content = `<div class="file-content"><strong>File from ${sender}:</strong><br>`;
                
                if (fileMimeType && fileMimeType.startsWith('image/')) {
                    content += `<a href="${fileDir}" target="_blank"><img src="${fileDir}" alt="Image" style="max-width: 100%; height: auto; border-radius: 5px;"></a>`;
                } else if (fileMimeType && fileMimeType.startsWith('video/')) {
                    content += `<video controls style="max-width: 100%; height: auto; border-radius: 5px;"><source src="${fileDir}" type="${fileMimeType}"></video>`;
                } else {
                    content += `<i class="fas fa-file"></i> <a href="${fileDir}" target="_blank">${originalName || 'Download File'}</a>`;
                }
                
                content += `</div>`;
                messageElement.innerHTML = content;
            } else {
                 // Handle Text Message
                messageElement.textContent = text;
            }
            
            messageDisplayArea.appendChild(messageElement);
            // Scroll to bottom
            messageDisplayArea.scrollTop = messageDisplayArea.scrollHeight;
        }

        function loadChatHistory(messages) {
            messageDisplayArea.innerHTML = ''; // Clear previous messages
            messages.forEach(msg => {
                const type = (msg.sender === username) ? 'sender' : 'receiver';
                displayMessage(msg.sender, msg.text, type, msg.fileDir, msg.fileMimeType, msg.originalName);
            });
        }
        
        function selectUser(user) {
            // Remove 'active' class from all users
            document.querySelectorAll('.online-user-item').forEach(item => item.classList.remove('active'));

            // Set the new active user
            const newUserElement = document.getElementById(user === AI_BOT_USERNAME ? 'ai-bot-user' : `user-${user}`);
            if (newUserElement) {
                newUserElement.classList.add('active');
            }

            currentChatRecipient = user;
            currentChatRecipientEl.textContent = `Chatting with: ${user}`;
            
            messageDisplayArea.innerHTML = ''; // Clear messages
            
            // Load history only for real users, not for the AI bot
            if (user !== AI_BOT_USERNAME) {
                socket.emit('loadChat', { sender: username, receiver: user });
            }
        }


        // --- INITIAL SETUP AND AUTH ---

        if (!username) {
            // Redirect to login if not authenticated
            if (!window.location.pathname.includes('login.html') && !window.location.pathname.includes('signup.html')) {
                 window.location.href = '/login.html'; 
            }
            return;
        }
        
        if (welcomeMessageEl) {
            welcomeMessageEl.textContent = `Welcome, ${username}!`;
        }

        // --- EVENT LISTENERS ---

        // Sidebar Toggles
        if (sidebarCollapse) {
            sidebarCollapse.addEventListener('click', toggleSidebar);
        }
        if (dismiss) {
            dismiss.addEventListener('click', toggleSidebar); 
        }

        // Logout
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('username');
                // Socket disconnect handled by server on page unload
                window.location.href = '/login.html';
            });
        }
        
        // File Attachment
        if(attachFileBtn && fileInput) {
            attachFileBtn.addEventListener('click', () => {
                // Only allow file upload for real users, not AI Bot
                if (currentChatRecipient && currentChatRecipient !== AI_BOT_USERNAME) {
                    fileInput.click();
                } else if (currentChatRecipient === AI_BOT_USERNAME) {
                     alert("File attachments are not allowed when chatting with the Aura Bot.");
                } else {
                     alert("Please select a user to chat with first.");
                }
            });
        }

        // --- SOCKET.IO EVENTS ---

        socket.on('connect', () => {
            console.log("Connected to socket server.");
            socket.emit('newUser', username); // Announce new user
        });

        // Update User List (including AI Bot insertion)
        socket.on('updateUsers', (users) => {
            onlineUsersList.innerHTML = ''; // Clear current list
            
            // 1. Add AI Bot (NEW)
            const aiLi = document.createElement('li');
            aiLi.className = 'online-user-item';
            aiLi.id = 'ai-bot-user';
            aiLi.innerHTML = `<i class="fas fa-robot" style="margin-right: 10px; color: #28a745;"></i> ${AI_BOT_USERNAME}`;
            onlineUsersList.appendChild(aiLi); 
            
            // Re-apply active class if AI Bot was selected
            if (currentChatRecipient === AI_BOT_USERNAME) {
                aiLi.classList.add('active');
            }
            
            aiLi.addEventListener('click', () => selectUser(AI_BOT_USERNAME));

            // 2. Add Real Users
            users.filter(u => u !== username).forEach(user => {
                const li = document.createElement('li');
                li.className = 'online-user-item';
                li.id = `user-${user}`;
                li.innerHTML = `<i class="fas fa-circle" style="font-size: 8px; color: #28a745; margin-right: 10px;"></i> ${user}`;
                onlineUsersList.appendChild(li);

                // Re-apply active class if user was selected
                if (currentChatRecipient === user) {
                    li.classList.add('active');
                }

                li.addEventListener('click', () => selectUser(user));
            });
        });

        // Receive Private Message
        socket.on('privateMessage', (msg) => {
            // Only display if message is for the current active chat
            if (msg.sender === currentChatRecipient || (msg.sender === username && msg.receiver === currentChatRecipient)) {
                const type = (msg.sender === username) ? 'sender' : 'receiver';
                displayMessage(msg.sender, msg.text, type, msg.fileDir, msg.fileMimeType, msg.originalName);
            }
        });

        // Receive Chat History
        socket.on('chatHistory', loadChatHistory);

        // --- MESSAGE SENDING LOGIC ---

        async function handleSendMessage(message, fileData = {}) {
            if (!currentChatRecipient) {
                alert("Please select a user or Aura Bot to chat with first.");
                return;
            }

            // --- 1. AI CHAT LOGIC ---
            if (currentChatRecipient === AI_BOT_USERNAME) {
                displayMessage(username, message, 'sender'); // Show user message immediately

                try {
                    const response = await fetch('/api/chat/ai', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: username, message: message })
                    });
                    const data = await response.json();

                    if (data.success) {
                        displayMessage(data.sender, data.response, 'receiver'); // Show AI response
                    } else {
                        displayMessage("System", `Error: ${data.message}`, 'receiver');
                    }
                } catch (error) {
                    console.error("AI Fetch Error:", error);
                    displayMessage("System", "AI connection failed. Check server logs.", 'receiver');
                }
            } 
            
            // --- 2. REAL USER CHAT LOGIC ---
            else {
                // Emit message via Socket.IO
                socket.emit('privateMessage', {
                    sender: username,
                    receiver: currentChatRecipient,
                    text: message,
                    fileDir: fileData.fileDir,
                    fileMimeType: fileData.fileMimeType,
                    originalName: fileData.originalName
                });
                // The message will be displayed back by the 'privateMessage' listener
            }
        }
        
        // Text Message Send Handler
        sendMessageBtn.addEventListener('click', () => {
            const message = messageInput.value.trim();
            if (message) {
                handleSendMessage(message);
                messageInput.value = '';
            }
        });

        // Press Enter to send
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const message = messageInput.value.trim();
                if (message) {
                    handleSendMessage(message);
                    messageInput.value = '';
                }
            }
        });
        
        // File Input Change Handler
        fileInput.addEventListener('change', async () => {
            if (!fileInput.files.length) return;

            const file = fileInput.files[0];
            
            // Show a placeholder message while uploading
            displayMessage(username, `Uploading file: ${file.name}...`, 'sender');
            
            const formData = new FormData();
            formData.append('chatFile', file);
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                // Remove placeholder message
                messageDisplayArea.lastChild.remove(); 

                if (data.success) {
                    // Send the file details as a message
                    handleSendMessage(`Sent file: ${file.name}`, {
                        fileDir: data.fileDir,
                        fileMimeType: data.fileMimeType,
                        originalName: data.originalName
                    });
                } else {
                    alert(`Upload failed: ${data.message}`);
                }
            } catch (error) {
                console.error("File upload error:", error);
                messageDisplayArea.lastChild.remove(); 
                alert("File upload failed due to server error.");
            }
            // Clear the file input
            fileInput.value = '';
        });
    });
</script> 

</body>
</html>
