<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura Hub - Chat</title>
  <style>
    /* style.css - Final Unified, Professional, and Theme-Enabled CSS */

/* 1. Global Reset & Root Variables */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

:root {
    /* --- DARK MODE --- */
    --bg-main: #181828;
    --bg-sidebar: #1c1c2c;
    --bg-component: #2a2a3d;
    --bg-chat-area: #181828;
    --color-primary: #5e6bfe;   /* Accent Blue */
    --color-text-main: #f0f0f0;
    --color-text-secondary: #aaaaaa;
    --color-border: #333;
    --color-error: #ef4444;
}

/* 2. Light Mode Variables */
body.light {
    --bg-main: #f0f2f5;
    --bg-sidebar: #ffffff;
    --bg-component: #e0e0e0;
    --bg-chat-area: #f5f5f5;
    --color-primary: #3F51B5;   /* Indigo Blue */
    --color-text-main: #212121;
    --color-text-secondary: #6c757d;
    --color-border: #ccc;
    --color-error: #dc3545;
}


/* 3. Base Body and Typography */
body {
    background: var(--bg-main);
    color: var(--color-text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

a {
    text-decoration: none;
    color: var(--color-primary);
    transition: color 0.3s;
}

/* 4. Main Navbar (Top Header - Desktop/General) */
nav {
    background: var(--bg-sidebar);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    font-weight: bold;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    flex-shrink: 0;
}
nav a {
    color: var(--color-text-main);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    transition: 0.3s;
    font-size: 0.9em;
}
nav a:hover {
    background: rgba(255,255,255,0.1);
}
nav .logout-btn {
    background: var(--color-error);
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}
/* New: Toggle Button Style */
#themeToggleBtn {
    background: var(--bg-component);
    color: var(--color-text-main);
    border: none;
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
    margin-left: 10px;
    font-weight: bold;
}

/* 5. Main Chat Layout */
.chat-container {
    flex: 1;
    display: flex;
    height: calc(100vh - 50px);
    overflow: hidden;
}

/* Sidebar (Left Panel) */
.sidebar {
    width: 250px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--color-border);
    padding: 15px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
}
.sidebar h3 {
    margin: 0 0 10px;
    font-size: 1.1em;
    border-bottom: 1px solid var(--color-border);
    padding-bottom: 6px;
    color: var(--color-primary);
}
.user {
    padding: 8px;
    background: var(--bg-component);
    margin: 4px 0;
    border-radius: 8px;
    font-size: 0.9em;
    color: var(--color-text-main);
}
.user:hover {
    background: #3a3a5a;
}

/* Chat Area */
.chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg-chat-area);
    overflow: hidden;
}
#chatBox {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: var(--bg-chat-area);
}
.msg {
    padding: 10px 14px;
    border-radius: 15px;
    max-width: 70%;
}
.me {
    background: var(--color-primary);
    color: white;
    margin-left: auto;
}
.other {
    background: var(--bg-component);
    color: var(--color-text-main);
    margin-right: auto;
}

/* Input Area */
#inputArea {
    display: flex;
    padding: 10px 20px;
    background: var(--bg-sidebar);
    border-top: 1px solid var(--color-border);
    flex-shrink: 0;
}
#messageInput {
    flex: 1;
    padding: 12px;
    border-radius: 20px;
    border: none;
    outline: none;
    background: var(--bg-component);
    color: var(--color-text-main);
    font-size: 1em;
}
#sendButton {
    background: var(--color-primary);
    border: none;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    margin-left: 8px;
    color: white;
    font-size: 1.2em;
    cursor: pointer;
}

/* Responsive (Minimal adjustments, relying on flex) */
@media (max-width: 600px) {
    nav {
        justify-content: space-between;
    }
    nav a {
        padding: 6px;
        font-size: 0.8em;
    }
    .chat-container {
        flex-direction: column;
    }
    .sidebar {
        width: 100%;
        height: 150px;
        order: -1;
    }
    .chat-area {
        height: calc(100vh - 200px);
    }
}

  </style>
</head>
<body>
  <!-- Navbar -->
  <nav>
    <a href="/index.html">Home</a>
    <a href="/chat.html" class="active">Chat</a>
    <a href="/profile.html">Profile</a>
    <a href="/games.html">Games</a>
    <a href="/videos.html">Videos</a>
    <a href="/about.html">About</a>
  </nav>

  <!-- Chat Container -->
  <div class="chat-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <h3>Online Users</h3>
      <div id="onlineUsers"></div>
    </div>

    <!-- Chat Window -->
    <div class="chat-window">
      <div class="messages" id="messages"></div>

      <!-- Input Bar -->
      <div class="input-bar">
        <input type="text" id="messageInput" placeholder="Type your message..."/>
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const username = localStorage.getItem("username") || "Guest";
    const avatar = localStorage.getItem("profilePicture") || "/uploads/default_avatar.jpg";
    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const onlineUsersDiv = document.getElementById("onlineUsers");

    // ✅ Join with username + avatar
    socket.emit("join", { username, avatar });

    // ✅ Receive message
    socket.on("message", (msg) => {
      const container = document.createElement("div");
      container.classList.add("message-container");
      container.classList.add(msg.username === username ? "sent" : "received");

      const avatarImg = document.createElement("img");
      avatarImg.src = msg.avatar || "/uploads/default_avatar.jpg";
      avatarImg.classList.add("message-avatar");

      const bubble = document.createElement("div");
      bubble.classList.add("message");
      bubble.textContent = msg.username + ": " + msg.text;

      if (msg.username === username) {
        container.appendChild(bubble);
        container.appendChild(avatarImg);
      } else {
        container.appendChild(avatarImg);
        container.appendChild(bubble);
      }

      messagesDiv.appendChild(container);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    // ✅ Update online users with avatar
    socket.on("updateUsers", (users) => {
      onlineUsersDiv.innerHTML = "";
      users.forEach((u) => {
        const userDiv = document.createElement("div");
        userDiv.classList.add("user");

        const img = document.createElement("img");
        img.src = u.avatar || "/uploads/default_avatar.jpg";
        img.alt = u.username;

        const span = document.createElement("span");
        span.textContent = u.username;

        userDiv.appendChild(img);
        userDiv.appendChild(span);
        onlineUsersDiv.appendChild(userDiv);
      });
    });

    // ✅ Send message
    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    function sendMessage() {
      const text = input.value.trim();
      if (text) {
        socket.emit("chatMessage", { username, text, avatar });
        input.value = "";
      }
    }
  </script>
</body>
</html>
