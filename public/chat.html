<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Hub - Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #3F51B5; /* Indigo */
            --secondary-color: #4CAF50; /* Green */
            --background-color: #f0f2f5;
            --chat-bg: #E8EAF6; /* Light Indigo */
            --drawer-bg: #2C3E50; /* Dark Blue-Gray */
            --text-color: #333;
            --online-dot: #4CAF50;
        }

        /* General Reset and Font */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
        }

        /* Drawer (Left Panel) Styling */
        .drawer {
            width: 280px;
            background-color: var(--drawer-bg);
            color: white;
            padding: 20px 0;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            height: 100%;
            left: -280px; /* Initially hidden */
            transition: left 0.3s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .drawer.open {
            left: 0;
        }

        .drawer-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
        }

        .drawer-header h2 {
            margin: 0;
            font-size: 1.5em;
            color: var(--secondary-color);
        }

        .drawer-nav ul {
            list-style: none;
            padding: 0 20px;
            margin: 0 0 20px 0;
        }

        .drawer-nav li {
            margin-bottom: 5px;
        }

        .drawer-nav a {
            display: block;
            padding: 10px 15px;
            text-decoration: none;
            color: white;
            border-radius: 6px;
            transition: background-color 0.2s;
            font-weight: 500;
        }

        .drawer-nav a:hover, .drawer-nav a.active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .drawer-nav i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        /* Online Users Section */
        .online-users-container {
            flex-grow: 1;
            padding: 0 20px;
            overflow-y: auto;
        }
        
        .online-users-container h3 {
            font-size: 1em;
            color: #ccc;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }
        
        #onlineUsersList {
            list-style: none;
            padding: 0;
        }

        #onlineUsersList li {
            padding: 10px;
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 5px;
            background-color: rgba(255, 255, 255, 0.05);
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            position: relative;
        }

        #onlineUsersList li:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }
        
        #onlineUsersList li.active-chat {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: var(--online-dot);
            border-radius: 50%;
            margin-right: 8px;
            display: inline-block;
        }

        .user-pic-small {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Main Chat Area */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s ease;
            margin-left: 0; /* Adjust for drawer open state */
            padding-top: 60px; /* Space for fixed header */
        }
        
        /* Fixed Top Header */
        .chat-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 50;
        }

        #menuToggle {
            background: none;
            border: none;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            padding: 5px;
        }
        
        .chat-title {
            display: flex;
            align-items: center;
            flex-grow: 1;
            margin-left: 20px;
        }
        
        .chat-title h2 {
            margin: 0;
            font-size: 1.2em;
        }
        
        .chat-title img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
            border: 2px solid white;
        }

        .header-actions {
            display: flex;
            align-items: center;
        }
        
        .header-actions button {
            background: none;
            border: none;
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            margin-left: 15px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .header-actions button:hover {
             opacity: 1;
        }
        
        /* Message Display Area */
        #messageDisplayArea {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
        }
        
        .empty-chat-message {
            margin: auto;
            font-size: 1.5em;
            color: #607D8B; /* Blue Grey */
            text-align: center;
            padding: 20px;
        }

        /* Single Message Styling */
        .message {
            max-width: 60%;
            margin: 5px 0;
            padding: 10px 15px;
            border-radius: 18px;
            line-height: 1.4;
            position: relative;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: flex-start;
        }

        .message-sender {
            margin-left: auto;
            background-color: var(--primary-color);
            color: white;
            border-top-right-radius: 0;
            flex-direction: row-reverse;
        }

        .message-receiver {
            background-color: white;
            border: 1px solid #ddd;
            border-top-left-radius: 0;
        }
        
        .message-content {
            flex-grow: 1;
            padding: 0 5px;
        }

        .message-sender .message-content {
            text-align: right;
            padding-right: 0;
            padding-left: 5px;
        }

        .message-timestamp {
            display: block;
            font-size: 0.7em;
            margin-top: 5px;
            opacity: 0.6;
            text-align: right;
        }

        /* Chat DP in Messages */
        .message-dp {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            margin: 0 8px 0 0;
        }
        .message-sender .message-dp {
            margin: 0 0 0 8px;
        }
        
        /* File Message Styling */
        .file-attachment {
            display: inline-flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.9);
            color: var(--primary-color);
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 5px;
            font-weight: 500;
            border: 1px solid #ccc;
        }
        
        .message-sender .file-attachment {
            background-color: #E0E7FF;
            color: var(--primary-color);
        }
        
        .file-attachment i {
            margin-right: 8px;
            font-size: 1.2em;
        }
        
        /* Input Area */
        .chat-input-area {
            display: flex;
            padding: 15px 20px;
            background-color: white;
            border-top: 1px solid #ddd;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
        }

        #messageInput {
            flex-grow: 1;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 1em;
            margin-right: 10px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
        }

        .input-actions {
            display: flex;
            align-items: center;
        }
        
        #fileInput {
            display: none;
        }

        #attachFileBtn, #sendMessageBtn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2em;
            cursor: pointer;
            margin-left: 8px;
            transition: background-color 0.2s;
        }
        
        #attachFileBtn {
            background-color: #FF9800; /* Orange for attachment */
        }
        
        #sendMessageBtn:hover {
            background-color: #388E3C;
        }

        #attachFileBtn:hover {
            background-color: #F57C00;
        }
        
        /* File upload status display */
        #fileStatus {
            margin-left: 10px;
            color: #FF9800;
            font-size: 0.9em;
            font-weight: 500;
        }
        
        /* Responsive Adjustments */
        @media (min-width: 768px) {
            .drawer {
                position: relative;
                left: 0 !important; /* Always visible on large screens */
                height: 100%;
            }

            .main-content {
                margin-left: 0; 
                padding-top: 0;
            }
            
            .chat-header {
                position: relative;
                top: auto;
                left: auto;
                right: auto;
                box-shadow: none;
                z-index: 1;
                margin-bottom: 0;
            }
            
            #menuToggle {
                display: none; /* Hide menu button on desktop */
            }
        }
        
        @media (max-width: 767px) {
            .main-content {
                width: 100%;
            }
            .drawer {
                width: 70%;
            }
        }
    </style>
</head>
<body>

    <div class="drawer" id="chatDrawer">
        <div class="drawer-header">
            <h2 id="welcomeMessage">Hello, user!</h2>
            <p style="font-size: 0.8em; color: #aaa;">Aura Hub Chat</p>
        </div>
        
        <nav class="drawer-nav">
            <ul>
                <li><a href="/index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="/chat.html" class="active"><i class="fas fa-comment"></i> Chat</a></li>
                <li><a href="/snake.html"><i class="fas fa-gamepad"></i> Games</a></li>
                <li><a href="/profile.html"><i class="fas fa-user-circle"></i> Profile</a></li>
                </ul>
        </nav>

        <div class="online-users-container">
            <h3>ONLINE USERS</h3>
            <ul id="onlineUsersList">
                </ul>
        </div>
        
        <div style="padding: 20px;">
            <button onclick="logout()" style="background-color: #E74C3C; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: 600;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>

    <div class="main-content">
        
        <div class="chat-header">
            <button id="menuToggle"><i class="fas fa-bars"></i></button>
            <div class="chat-title">
                <img id="recipientPicHeader" src="/uploads/default_avatar.png" alt="DP">

                <button onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>

             <p class="empty-chat-message">← Select a user from the side menu to begin conversation.</p>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." disabled>
            
            <input type="file" id="fileInput" name="chatFile">
            
            <div class="input-actions">
                 <span id="fileStatus"></span>
                <button id="attachFileBtn" title="Attach File" disabled><i class="fas fa-paperclip"></i></button>
                <button id="sendMessageBtn" disabled><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

} else {

    username = username.trim(); 
    
    // Update the UI element (e.g., the welcome message in the sidebar)

    if (sidebarWelcomeElement) {

        // --- INITIALIZATION ---
        // FIX: Ensure username is set to null/undefined if it's the string 'undefined'
        let username = localStorage.getItem('username');

        // FIX: If the username is a placeholder 'undefined' string, treat it as not logged in
        if (username === 'undefined' || !username) {
            console.log("Username not found or is 'undefined', clearing storage and redirecting.");
            localStorage.removeItem('username'); // Clear bad data
            window.location.href = '/login.html';
            // return; // We keep running to set up elements, but the chat will be mostly disabled
        }
        
        // --- DOM Elements ---
        const menuToggle = document.getElementById('menuToggle');
        const chatDrawer = document.getElementById('chatDrawer');
        const welcomeMessageEl = document.getElementById('welcomeMessage');
        const onlineUsersList = document.getElementById('onlineUsersList');
        const messageInput = document.getElementById('messageInput');
        const sendMessageBtn = document.getElementById('sendMessageBtn');
        const messageDisplayArea = document.getElementById('messageDisplayArea');
        const attachFileBtn = document.getElementById('attachFileBtn');
        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const recipientNameHeader = document.getElementById('recipientNameHeader');
        const recipientPicHeader = document.getElementById('recipientPicHeader');
        
        // --- State Variables ---
        let socket = null;
        let currentRecipient = null;
        let fileToUpload = null;
        let onlineUsersMap = {}; // To store usernames and their profile pictures

        // --- Utility Functions ---
        function formatTimestamp(dateString) {
            const date = new Date(dateString);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        function scrollChatToBottom() {
            messageDisplayArea.scrollTop = messageDisplayArea.scrollHeight;
        }

        // --- Chat UI Rendering ---
        function appendMessage(msg, isSender, senderPicture) {
            const messageEl = document.createElement('div');
            messageEl.classList.add('message');
            messageEl.classList.add(isSender ? 'message-sender' : 'message-receiver');
            
            // Profile Picture
            const dpEl = document.createElement('img');
            dpEl.classList.add('message-dp');
            dpEl.src = senderPicture || '/uploads/default_avatar.png';
            dpEl.alt = 'DP';
            
            // Content container
            const contentEl = document.createElement('div');
            contentEl.classList.add('message-content');

            if (msg.text) {
                contentEl.innerHTML += `<p style="margin: 0;">${msg.text}</p>`;
            }

            if (msg.fileDir && msg.originalName) {
                const fileLink = document.createElement('a');
                fileLink.classList.add('file-attachment');
                fileLink.href = msg.fileDir;
                fileLink.target = '_blank';
                fileLink.download = msg.originalName;
                fileLink.innerHTML = `<i class="${getFileIcon(msg.fileMimeType)}"></i> ${msg.originalName}`;
                contentEl.appendChild(fileLink);
            }

            // Timestamp
            contentEl.innerHTML += `<span class="message-timestamp">${formatTimestamp(msg.timestamp)}</span>`;

            // Append elements based on sender/receiver layout
            if (isSender) {
                messageEl.appendChild(contentEl);
                messageEl.appendChild(dpEl);
            } else {
                messageEl.appendChild(dpEl);
                messageEl.appendChild(contentEl);
            }

            // Remove 'Select user' message if it exists
            const emptyMsg = messageDisplayArea.querySelector('.empty-chat-message');
            if (emptyMsg) emptyMsg.remove();

            messageDisplayArea.appendChild(messageEl);
            scrollChatToBottom();
        }

        function getFileIcon(mimeType) {
            if (mimeType.startsWith('image')) return 'fas fa-image';
            if (mimeType.startsWith('video')) return 'fas fa-video';
            if (mimeType.startsWith('audio')) return 'fas fa-music';
            if (mimeType.includes('pdf')) return 'fas fa-file-pdf';
            if (mimeType.includes('zip') || mimeType.includes('rar')) return 'fas fa-file-archive';
            return 'fas fa-file';
        }

        // --- Chat Core Logic ---
        function startChat(recipient) {
            if (recipient === username || !username) return;

            // Update UI state
            currentRecipient = recipient;
            recipientNameHeader.textContent = recipient;
            
            // Set recipient's DP in the header (if available in map)
            recipientPicHeader.src = onlineUsersMap[recipient] || '/uploads/default_avatar.png';
            
            // Highlight selected user in the list
            document.querySelectorAll('#onlineUsersList li').forEach(li => {
                li.classList.remove('active-chat');
                if (li.dataset.username === recipient) {
                    li.classList.add('active-chat');
                }
            });

            // Enable input and buttons
            messageInput.disabled = false;
            sendMessageBtn.disabled = false;
            attachFileBtn.disabled = false;
            messageInput.focus();
            
            // Clear message area and load history
            messageDisplayArea.innerHTML = '';
            messageDisplayArea.innerHTML = `<p class="empty-chat-message">Loading chat with ${recipient}...</p>`;
            socket.emit('loadChat', { sender: username, receiver: recipient });
        }
