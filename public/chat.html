<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatHub - Chat</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* Add your chat specific styles here */
        .sidebar {
            width: 250px;
            height: 100%;
            position: fixed;
            top: 0;
            left: -250px; /* Initially hidden */
            background-color: #2c3e50;
            padding-top: 60px;
            transition: 0.3s;
            z-index: 10;
            color: white;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 18px;
            color: #ecf0f1;
            display: block;
        }
        .sidebar a:hover {
            background-color: #34495e;
        }
        .content {
            margin-left: 0;
            padding: 20px;
            transition: margin-left 0.3s;
        }
        .content.shifted {
            margin-left: 250px;
        }
        .menu-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 30px;
            cursor: pointer;
            z-index: 20;
            color: #ecf0f1;
            background: none;
            border: none;
        }
        .header {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .online-user-list {
            margin: 20px;
            list-style: none;
            padding: 0;
        }
        .online-user-list li {
            padding: 8px;
            border-bottom: 1px solid #34495e;
            cursor: pointer;
        }
        .online-user-list li:hover {
            background-color: #4a637c;
        }
        .chat-window {
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #fff;
        }
        .message-input-area {
            display: flex;
        }
        .message-input-area input {
            flex-grow: 1;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h2 id="main-welcome-text"></h2>
        <button onclick="logout()" class="logout-btn">Logout</button>
    </div>

    <div id="sidebar" class="sidebar">
        <h3 style="padding: 15px; text-align: center; border-bottom: 1px solid #34495e;" id="sidebar-welcome-text"></h3>
        <a href="/">Home</a>
        <a href="/chat.html">Chat</a>
        <a href="/profile.html">Profile</a>
        <a href="/games.html">Games</a>
        <a href="/videos.html">Videos</a>
        <h4 style="padding: 15px; border-top: 1px solid #34495e;">ONLINE USERS</h4>
        <ul id="online-users" class="online-user-list">
            </ul>
    </div>

    <div id="content" class="content">
        <h1>Select a user to start chatting</h1>
        <div id="chat-box" style="display: none;">
            <h2>Chatting with: <span id="receiver-name"></span></h2>
            <div id="messages" class="chat-window">
                </div>
            <div class="message-input-area">
                <input type="text" id="message-input" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

<script>
    // --- UTILITIES & AUTHENTICATION ---
    const socket = io();

    function logout() {
        // FIX: Clear all local storage data completely
        localStorage.clear(); 
        window.location.href = "/login.html";
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('content').classList.toggle('shifted');
    }

    // --- ON LOAD LOGIC (FIXED) ---
    let username = localStorage.getItem('username');

    // FIX: Strong check for null, empty string, or the literal string "undefined"
    if (!username || username === "undefined" || username.trim() === "") {
        console.log("Invalid username found. Redirecting to login.");
        localStorage.clear(); 
        window.location.href = "/login.html";
    } else {
        username = username.trim(); 
        
        // Update UI with the valid username
        const mainWelcome = document.getElementById('main-welcome-text'); 
        if (mainWelcome) {
            mainWelcome.textContent = `Welcome, ${username}!`; 
        }

        const sidebarWelcome = document.getElementById('sidebar-welcome-text'); 
        if (sidebarWelcome) {
            sidebarWelcome.textContent = `Hello, ${username}!`; 
        }
        
        // Register user with Socket.IO
        socket.emit('register', username); 
    }

    // --- SOCKET.IO LOGIC ---
    let receiver = null;

    socket.on('user_online', (users) => {
        const ul = document.getElementById('online-users');
        ul.innerHTML = '';
        users.forEach(user => {
            if (user !== username) { // Don't show current user
                const li = document.createElement('li');
                li.textContent = user;
                li.onclick = () => startChat(user);
                ul.appendChild(li);
            }
        });
    });

    socket.on('new_private_message', (msg) => {
        if (msg.sender === receiver || msg.sender === username) {
            displayMessage(msg);
        }
    });

    // --- CHAT LOGIC ---

    function startChat(selectedUser) {
        receiver = selectedUser;
        document.getElementById('receiver-name').textContent = receiver;
        document.getElementById('chat-box').style.display = 'block';
        document.getElementById('messages').innerHTML = ''; // Clear previous messages
        
        fetchHistory();
    }

    async function fetchHistory() {
        if (!username || !receiver) return;
        
        try {
            const response = await fetch(`/api/messages/${username}/${receiver}`);
            const data = await response.json();

            if(data.success) {
                data.messages.forEach(msg => displayMessage(msg));
            } else {
                console.error("Failed to load chat history:", data.message);
            }
        } catch (error) {
            console.error("Error fetching chat history:", error);
        }
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();

        if (text === '' || !receiver) return;

        const msg = {
            sender: username,
            receiver: receiver,
            text: text,
            timestamp: new Date().toISOString()
        };

        socket.emit('private_message', msg);
        input.value = '';
    }

    function displayMessage(msg) {
        const messagesDiv = document.getElementById('messages');
        const p = document.createElement('p');
        const sender = msg.sender === username ? 'You' : msg.sender;
        p.textContent = `${sender}: ${msg.text}`;
        
        // Add styling for own messages vs others
        p.style.textAlign = msg.sender === username ? 'right' : 'left';
        
        messagesDiv.appendChild(p);
        messagesDiv.scrollTop = messagesDiv.scrollHeight; // Scroll to bottom
    }

</script>
</body>
</html>
