<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Chat</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  body {
    background: #1e1e2f;
    color: #f5f5f5;
    font-family: 'Poppins', sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #2b2b3d;
    padding: 12px 20px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    border-bottom: 2px solid #444;
  }
  .chat-container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  .user-list {
    width: 30%;
    background: #242437;
    border-right: 2px solid #444;
    overflow-y: auto;
  }
  .user-item {
    padding: 15px;
    border-bottom: 1px solid #3b3b50;
    cursor: pointer;
    transition: background 0.3s;
  }
  .user-item:hover, .user-item.active {
    background: #3e3e60;
  }
  .chat-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #1b1b2b;
  }
  .messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
  }
  .message {
    margin: 8px 0;
    padding: 10px;
    border-radius: 8px;
    max-width: 80%;
    word-wrap: break-word;
  }
  .sender {
    background: #4a59e6;
    align-self: flex-end;
  }
  .receiver {
    background: #333;
    align-self: flex-start;
  }
  .input-area {
    display: flex;
    padding: 10px;
    background: #2b2b3d;
    border-top: 2px solid #444;
  }
  .input-area input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 6px;
    outline: none;
    background: #1f1f2f;
    color: #fff;
  }
  .input-area button {
    background: #4a59e6;
    border: none;
    color: white;
    padding: 10px 15px;
    margin-left: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }

  @media (max-width: 768px) {
    .chat-container {
      flex-direction: column;
    }
    .user-list {
      width: 100%;
      display: flex;
      overflow-x: auto;
    }
    .user-item {
      flex: 1;
      text-align: center;
      border-right: 1px solid #3b3b50;
      border-bottom: none;
    }
  }
</style>
</head>
<body>
  <header>💬 Aura Hub Chat</header>
  <div class="chat-container">
    <div class="user-list" id="userList">
      <div class="user-item">Loading users...</div>
    </div>

    <div class="chat-box">
      <div class="messages" id="messageArea">
        <p style="text-align:center; color:#aaa;">Select a user to start chat</p>
      </div>
      <div class="input-area">
        <input id="messageInput" placeholder="Type a message..." />
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

<script>
  const username = localStorage.getItem("username");
  if (!username) window.location.href = "/login.html";

  const socket = io();
  socket.emit("registerUser", username);

  const userList = document.getElementById("userList");
  const messageArea = document.getElementById("messageArea");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  let currentChat = null;

  socket.on("updateUserList", (users) => {
    userList.innerHTML = '';
    users.forEach(u => {
      if (u !== username) {
        const el = document.createElement("div");
        el.className = "user-item";
        el.textContent = u;
        el.onclick = () => selectUser(u, el);
        userList.appendChild(el);
      }
    });
  });

  function selectUser(u, el) {
    currentChat = u;
    document.querySelectorAll(".user-item").forEach(i => i.classList.remove("active"));
    el.classList.add("active");
    socket.emit("loadChat", { user1: username, user2: u });
    messageArea.innerHTML = `<p style="text-align:center; color:#aaa;">Chatting with ${u}</p>`;
  }

  socket.on("chatHistory", (messages) => {
    messageArea.innerHTML = '';
    messages.forEach(m => displayMessage(m));
  });

  sendBtn.onclick = sendMessage;
  messageInput.addEventListener("keypress", e => e.key === "Enter" && sendMessage());

  function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !currentChat) return;
    socket.emit("privateMessage", { sender: username, receiver: currentChat, text });
    messageInput.value = '';
  }

  socket.on("privateMessage", (msg) => displayMessage(msg));

  function displayMessage(msg) {
    const div = document.createElement("div");
    div.classList.add("message", msg.sender === username ? "sender" : "receiver");
    div.textContent = msg.text;
    messageArea.appendChild(div);
    messageArea.scrollTop = messageArea.scrollHeight;
  }
</script>
</body>
</html>
