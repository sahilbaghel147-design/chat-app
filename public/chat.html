<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura Hub - Chat</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0f0f1a;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Navbar */
    nav {
      background: linear-gradient(135deg, #5e6bfe, #4a59e6);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    }
    nav a {
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      transition: 0.3s;
    }
    nav a:hover { background: rgba(255,255,255,0.2); }
    nav a.active { background: rgba(255,255,255,0.3); }

    /* Layout */
    .chat-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 220px;
      background: #181828;
      border-right: 1px solid #2c2c3e;
      padding: 15px;
      overflow-y: auto;
    }
    .sidebar h3 {
      margin-top: 0;
      color: #5e6bfe;
      font-size: 1.1em;
      border-bottom: 1px solid #2c2c3e;
      padding-bottom: 8px;
    }
    .user {
      display: flex;
      align-items: center;
      padding: 8px;
      margin: 5px 0;
      background: #222233;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
    .user:hover { background: #2c2c3e; }
    .user img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      margin-right: 10px;
      object-fit: cover;
    }
    .user span {
      font-size: 0.9em;
      color: #ddd;
    }

    .chat-window {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #12121c;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .message-container {
      display: flex;
      align-items: flex-end;
      margin-bottom: 12px;
    }
    .message-container.sent { justify-content: flex-end; }
    .message-container.received { justify-content: flex-start; }

    .message-avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      margin: 0 8px;
      object-fit: cover;
    }

    .message {
      max-width: 65%;
      padding: 12px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 0.95em;
      word-wrap: break-word;
    }
    .sent .message {
      background: #5e6bfe;
      border-bottom-right-radius: 4px;
    }
    .received .message {
      background: #2c2c3e;
      border-bottom-left-radius: 4px;
    }

    /* Input Bar */
    .input-bar {
      display: flex;
      padding: 12px;
      background: #181828;
      border-top: 1px solid #2c2c3e;
    }
    #messageInput {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 1em;
      background: #2c2c3e;
      color: white;
    }
    #sendBtn {
      background: #5e6bfe;
      border: none;
      padding: 12px 20px;
      margin-left: 10px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    #sendBtn:hover { background: #4a59e6; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav>
    <a href="/index.html">Home</a>
    <a href="/chat.html" class="active">Chat</a>
    <a href="/profile.html">Profile</a>
    <a href="/games.html">Games</a>
    <a href="/videos.html">Videos</a>
    <a href="/about.html">About</a>
  </nav>

  <!-- Chat Container -->
  <div class="chat-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <h3>Online Users</h3>
      <div id="onlineUsers"></div>
    </div>

    <!-- Chat Window -->
    <div class="chat-window">
      <div class="messages" id="messages"></div>

      <!-- Input Bar -->
      <div class="input-bar">
        <input type="text" id="messageInput" placeholder="Type your message..."/>
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const username = localStorage.getItem("username") || "Guest";
    const avatar = localStorage.getItem("profilePicture") || "/uploads/default_avatar.jpg";
    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const onlineUsersDiv = document.getElementById("onlineUsers");

    // ✅ Join with username + avatar
    socket.emit("join", { username, avatar });

    // ✅ Receive message
    socket.on("message", (msg) => {
      const container = document.createElement("div");
      container.classList.add("message-container");
      container.classList.add(msg.username === username ? "sent" : "received");

      const avatarImg = document.createElement("img");
      avatarImg.src = msg.avatar || "/uploads/default_avatar.jpg";
      avatarImg.classList.add("message-avatar");

      const bubble = document.createElement("div");
      bubble.classList.add("message");
      bubble.textContent = msg.username + ": " + msg.text;

      if (msg.username === username) {
        container.appendChild(bubble);
        container.appendChild(avatarImg);
      } else {
        container.appendChild(avatarImg);
        container.appendChild(bubble);
      }

      messagesDiv.appendChild(container);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    // ✅ Update online users with avatar
    socket.on("updateUsers", (users) => {
      onlineUsersDiv.innerHTML = "";
      users.forEach((u) => {
        const userDiv = document.createElement("div");
        userDiv.classList.add("user");

        const img = document.createElement("img");
        img.src = u.avatar || "/uploads/default_avatar.jpg";
        img.alt = u.username;

        const span = document.createElement("span");
        span.textContent = u.username;

        userDiv.appendChild(img);
        userDiv.appendChild(span);
        onlineUsersDiv.appendChild(userDiv);
      });
    });

    // ✅ Send message
    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    function sendMessage() {
      const text = input.value.trim();
      if (text) {
        socket.emit("chatMessage", { username, text, avatar });
        input.value = "";
      }
    }
  </script>
</body>
</html>
