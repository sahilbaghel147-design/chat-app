<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Hub Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
  <style>
    /* ===== style.css ===== */
body {
  margin: 0;
  background: #0f172a;
  color: #fff;
  font-family: "Poppins", sans-serif;
}

.chat-wrapper {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  background: #2563eb;
  padding: 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
}

.chat-body {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* Sidebar */
.online-users {
  width: 180px;
  background: #1e293b;
  padding: 15px;
  border-right: 1px solid #334155;
}

.online-users h3 {
  margin-top: 0;
  margin-bottom: 10px;
  font-size: 1em;
  text-align: center;
  color: #93c5fd;
}

.online-users ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.online-users li {
  background: #334155;
  padding: 8px;
  border-radius: 8px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: background 0.2s;
}

.online-users li:hover {
  background: #475569;
}

/* Chat area */
.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #0f172a;
}

.messages {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.message {
  background: #1e293b;
  padding: 10px;
  border-radius: 10px;
  max-width: 70%;
}

.message.self {
  background: #2563eb;
  align-self: flex-end;
}

.sender {
  font-size: 0.8em;
  opacity: 0.7;
}

.info-note {
  text-align: center;
  opacity: 0.7;
  margin-bottom: 10px;
}

#chat-form {
  display: flex;
  border-top: 1px solid #334155;
}

#chat-input {
  flex: 1;
  padding: 12px;
  border: none;
  outline: none;
  background: #1e293b;
  color: white;
  font-size: 1em;
}

button {
  background: #2563eb;
  border: none;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  padding: 0 20px;
  transition: background 0.3s;
}

button:hover {
  background: #1d4ed8;
}

  </style>
<body>
  <div class="chat-wrapper">
    <header>
      <h2>💬 Aura Hub Chat</h2>
      <div id="username-display"></div>
    </header>

    <div class="chat-body">
      <aside class="online-users">
        <h3>Online Users</h3>
        <ul id="users-list"></ul>
      </aside>

      <main class="chat-area">
        <div id="chat-box" class="messages"></div>
        <form id="chat-form">
          <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </main>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const usersList = document.getElementById("users-list");
    const chatBox = document.getElementById("chat-box");
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");
    const usernameDisplay = document.getElementById("username-display");

    // 🧠 Username setup
    let currentUser = localStorage.getItem("username");
    if (!currentUser) {
      currentUser = prompt("Enter your username:");
      localStorage.setItem("username", currentUser);
    }
    usernameDisplay.textContent = `👤 ${currentUser}`;

    // 🟢 Notify server about new user
    socket.emit("newUser", currentUser);

    // 🧍 Update online users
    socket.on("updateUsers", (users) => {
      usersList.innerHTML = "";
      users.forEach((user) => {
        if (user === currentUser) return;
        const li = document.createElement("li");
        li.textContent = user;
        li.addEventListener("click", () => {
          selectedUser = user;
          chatBox.innerHTML = "";
          const note = document.createElement("div");
          note.className = "info-note";
          note.textContent = `💬 Chatting with ${selectedUser}`;
          chatBox.appendChild(note);
        });
        usersList.appendChild(li);
      });
    });

    // 💬 Send message
    let selectedUser = null;
    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!chatInput.value.trim() || !selectedUser) return;

      const message = {
        sender: currentUser,
        receiver: selectedUser,
        text: chatInput.value.trim()
      };

      socket.emit("privateMessage", message);
      chatInput.value = "";
    });

    // 📥 Receive messages
    socket.on("privateMessage", (msg) => {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message");
      if (msg.sender === currentUser) msgDiv.classList.add("self");

      const sender = document.createElement("span");
      sender.classList.add("sender");
      sender.textContent = msg.sender;

      const text = document.createElement("p");
      text.textContent = msg.text;

      msgDiv.appendChild(sender);
      msgDiv.appendChild(text);
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
