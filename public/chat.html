<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura Hub - Chat</title>
  
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* --- CSS Variables and Global Styles --- */
    :root {
      --bg-main: #181828;
      --panel: #1c1c2c;
      --panel-2: #2a2a3d;
      --text: #f0f0f0;
      --muted: #aaaaaa;
      --accent: #7c5cff; 
      --danger: #ff5c7a;
      --radius: 10px;
    }
    body {
      margin: 0; padding: 0; background: var(--bg-main); color: var(--text);
      font-family: "Segoe UI", sans-serif; display: flex; flex-direction: column; min-height: 100vh;
    }
    
    /* Navbar */
    nav {
      background: var(--panel-2);
      padding: 12px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a { color: var(--text); text-decoration: none; padding: 8px 12px; border-radius: 6px; transition: 0.2s; }
    nav a:hover, nav a.active { background: rgba(255,255,255,0.1); }
    .logout-btn { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }


    /* Main Layout and Sidebar */
    .chat-container { flex: 1; display: flex; height: calc(100vh - 50px); overflow: hidden; }
    .sidebar { width: 250px; background: var(--panel); padding: 15px; flex-shrink: 0; overflow-y: auto; }
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); overflow: hidden; }
    
    .sidebar h3 { color: var(--accent); border-bottom: 1px solid #444; padding-bottom: 6px; margin: 0 0 10px 0; }
    #usersList { list-style: none; padding: 0; }
    .user { padding: 8px; background: var(--panel-2); margin: 4px 0; border-radius: 6px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 10px; }
    .user:hover, .user.active { background: #3a3a5a; }
    .online-dot { width: 8px; height: 8px; background: #4CAF50; border-radius: 50%; display: inline-block; }


    /* Chat Area */
    #chatRecipientHeader { padding: 15px; background: var(--panel-2); border-bottom: 1px solid #333; font-weight: 700; }
    #chatBox { flex: 1; padding: 15px; overflow-y: auto; }

    /* Message Styling */
    .msg-row{display:flex; margin:8px 0; align-items:flex-end;}
    .me .msg-row{flex-direction:row-reverse} /* Flip direction for sender */
    
    .msg-content{max-width:70%;}
    .msg{ padding:10px 12px; border-radius:14px; background:var(--panel-2); border:1px solid rgba(255,255,255,.06); }
    .me .msg{ background:var(--accent); color:#111; border-color:#5dd6ff; }
    .meta{font-size:11px; color:var(--muted); margin-top:2px;}
    .me .meta{text-align:right;}

    /* 🚨 NEW: Typing Indicator */
    #typingIndicator { color: #5dd6ff; font-style: italic; padding: 0 15px; height: 20px; font-size: 0.9em; }

    /* Input Area */
    .composer{ display:flex; gap:10px; align-items:center; padding:10px 20px; background:var(--panel); border-top:1px solid #333; flex-shrink: 0; }
    #messageInput { flex:1; height:44px; padding:0 14px; color:var(--text); background:var(--panel-2); border:none; border-radius:20px; outline:none; }
    #sendButton, #attachButton { background:var(--accent); color:white; border:none; width:40px; height:40px; border-radius:50%; font-size:1.1em; cursor:pointer; margin-left:5px; }
    #sendButton { background: #44d07b; }
    #attachButton { background: #5e6bfe; }
    
    /* Responsive Adjustments */
    @media (max-width: 600px) {
        .chat-container{flex-direction:column;}
        .sidebar{width:100%; height:auto; order:-1;}
        .chat-area{height:calc(100vh - 100px);}
    }
  </style>
</head>
<body>
  <nav>
    <div class="brand">ChatHub</div>
    <div style="flex-grow: 1; text-align: right;">
        <a href="/index.html">Home</a>
        <a href="/chat.html" class="active">Chat</a>
        <a href="/profile.html">Profile</a>
        <a href="/games.html">Games</a>
        <a href="/videos.html">Videos</a>
        <a href="/about.html">About</a>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <main class="page chat-container">
    <aside class="card sidebar">
      <h3>🟢 Online Users</h3>
      <div id="usersList"></div>
    </aside>

    <section class="chat-area">
        <h2 id="chatRecipientHeader">Select a User to Chat</h2>
        
        <div id="typingIndicator"></div>
        
      <div id="chatBox">
         <div class="muted" style="text-align:center; padding:20px;">Start by clicking a user name.</div>
      </div>

      <form id="composer" class="composer" autocomplete="off">
        <input type="file" id="fileInput" style="display:none;">
        <button type="button" id="attachButton" disabled><i class="fas fa-paperclip"></i></button>
        <input id="messageInput" class="input" type="text" placeholder="Type your message…" maxlength="1000" disabled />
        <button class="btn" type="submit" id="sendButton" disabled>➤</button>
      </form>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // --- Initial Setup and Helpers ---
    const qs = (s) => document.querySelector(s);
    const getUsername = () => {
      const name = localStorage.getItem('username');
      if(!name || name === 'undefined' || !name.trim()){
        window.location.href = '/login.html';
        return 'Guest';
      }
      return name.trim();
    }
    const USERNAME = getUsername();
    
    // UI Elements
    const chatBox = qs('#chatBox');
    const messageInput = qs('#messageInput');
    const sendButton = qs('#sendButton');
    const usersList = qs('#usersList');
    const recipientHeader = qs('#chatRecipientHeader');
    const composerForm = qs('#composer');
    const fileInput = qs('#fileInput');
    const attachButton = qs('#attachButton');
    const typingIndicator = qs('#typingIndicator');

    let currentRecipient = null; 
    let typingTimer; // For typing indicator
    
    // Connect socket
    const socket = io();
    
    // --- Message Rendering and Helpers ---
    function formatTime(d){
        return new Intl.DateTimeFormat([], {hour:'2-digit', minute:'2-digit'}).format(d);
    }
    function escapeHtml(str){
      return (str+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    
    function addMessage(msg, isSelf=false){
      if (!isSelf && msg.sender !== currentRecipient) return; // Only show for active chat

      const row = document.createElement('div');
      row.className = 'msg-row' + (isSelf || msg.sender === USERNAME ? ' me' : '');
      
      const content = document.createElement('div');
      content.className = 'msg-content';
      
      const bubble = document.createElement('div');
      bubble.classList.add('msg');
      bubble.innerHTML = `
        <div class="username-tag">${msg.sender}</div>
        ${escapeHtml(msg.text)}
        <div class="meta">${formatTime(new Date(msg.timestamp || Date.now()))}</div>
      `;
      
      row.appendChild(content);

      if (isSelf || msg.sender === USERNAME) {
          row.style.flexDirection = 'row-reverse';
      } else {
          row.style.flexDirection = 'row';
      }
      
      content.appendChild(bubble); // Append bubble after meta/username
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- User Management ---
    function startChat(recipient) {
        if (recipient === currentRecipient) return;

        currentRecipient = recipient;
        recipientHeader.textContent = `Chatting with: ${recipient}`;
        chatBox.innerHTML = ''; // Clear chat area
        chatBox.innerHTML = `<div class="muted" style="text-align:center; padding:20px;">Loading chat history...</div>`;

        // Enable input and buttons
        messageInput.disabled = false;
        sendButton.disabled = false;
        attachButton.disabled = false;
        messageInput.focus();
        
        // Update active class in sidebar
        document.querySelectorAll('.user').forEach(el => el.classList.remove('active'));
        qs(`.user[data-username="${recipient}"]`).classList.add('active');
        
        // Load chat history (Your server needs to handle this event)
        socket.emit("loadChat", { user1: USERNAME, user2: currentRecipient }); 
    }

    function renderUsers(list=[]){
      usersList.innerHTML = '';
      list.forEach(u => {
        if (u === USERNAME) return;

        const el = document.createElement('div');
        el.className = 'user';
        el.dataset.username = u;
        const letter = (u||'?').slice(0,1).toUpperCase();

        el.innerHTML = `
          <div class="avatar-img" style="background:var(--accent); display:grid; place-items:center; font-size:16px;">${letter}</div>
          <div class="u-name">${u||'Unknown'}</div>
        `;
        
        // Start chat on user click
        el.onclick = () => startChat(u); 
        
        usersList.appendChild(el);
      });
      if(list.length <= 1){
        usersList.innerHTML = `<div class="muted" style="padding:8px 10px;">No one else online</div>`;
      }
    }


    // --- Socket Logic ---
    socket.on('connect', () => {
      socket.emit('newUser', USERNAME); // Register user
    });

    socket.on("updateUsers", (users) => { // Array of usernames
      renderUsers(users);
    });
    
    // 🚨 NEW: Typing Indicator Listeners
    socket.on("userTyping", ({ sender }) => {
        if (sender === currentRecipient) {
            typingIndicator.textContent = `${sender} is typing...`;
        }
    });

    socket.on("stopTyping", ({ sender }) => {
        if (sender === currentRecipient) {
            typingIndicator.textContent = '';
        }
    });
    
    // Listener for chat history retrieval
    socket.on("chatHistory", (history) => {
        chatBox.innerHTML = ''; // Clear "loading" message
        history.forEach(msg => addMessage(msg));
    });

    socket.on("privateMessage", (msg) => {
        // Display only if it's the current active chat
        if (msg.sender === currentRecipient || msg.receiver === currentRecipient) {
             addMessage(msg);
        }
    });


    // --- Send Message Logic ---
    composerForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const text = messageInput.value.trim();
        if (!text || !currentRecipient) {
            if (!currentRecipient) alert("Please select a user to chat.");
            return;
        }

        const messagePayload = { 
            sender: USERNAME, 
            receiver: currentRecipient, 
            text: text,
            timestamp: new Date().toISOString()
        };
        
        // Send message to server
        socket.emit("privateMessage", messagePayload); 
        
        // 🚨 Send 'stopTyping' event immediately after sending
        socket.emit("stopTyping", currentRecipient);

        // Optimistic rendering
        addMessage(messagePayload, true);
        
        messageInput.value = "";
        messageInput.focus();
    });
    
    // 🚨 NEW: Typing Indicator Logic
    messageInput.addEventListener('input', () => {
        if (!currentRecipient) return;

        if (typingTimer) clearTimeout(typingTimer);
        
        // Send typing event
        socket.emit("typing", currentRecipient);

        // Set a timer to stop typing after 1 second of no input
        typingTimer = setTimeout(() => {
            socket.emit("stopTyping", currentRecipient);
        }, 1000);
    });


    // --- General Functions ---
    function logout() {
        localStorage.clear();
        window.location.href = "/login.html";
    }

  </script>
</body>
</html>
