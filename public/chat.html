<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura Hub - Chat</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">


  <style>
    /* --- CSS Variables and Global Styles --- */
    :root{
      --bg:#0f0f1a;
      --panel:#17192b;
      --panel-2:#1e2238;
      --text:#e7e9f3;
      --muted:#a3a7c2;
      --accent:#7c5cff;
      --accent-2:#5dd6ff;
      --danger:#ff5c7a;
      --radius:14px;
      --shadow:0 5px 20px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Roboto, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      display:flex; flex-direction:column;
    }

    /* --- Navigation --- */
    .nav{
      position:sticky; top:0; z-index:50;
      background:var(--panel-2);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .nav-inner{
      max-width:1100px; margin:auto;
      padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:14px;
    }
    .brand{
      font-weight:700; letter-spacing:.3px;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .tabs{display:flex; gap:14px; flex-wrap:wrap}
    .tab{
      text-decoration:none; color:var(--muted); font-weight:500;
      padding:8px 12px; border-radius:999px; transition:.2s;
    }
    .tab:hover{color:var(--text); background:rgba(255,255,255,.06)}
    .tab.active{background:var(--accent); color:#111}
    .logout-btn{
        background:var(--danger); color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer;
    }
    .menu-toggle{display:none; background:none; border:none; color:var(--text); font-size:1.5em; cursor:pointer;}


    /* --- Layout --- */
    .page{
      flex:1; display:grid; 
      grid-template-columns: 280px 1fr; gap:16px;
      max-width:1100px; margin:18px auto; padding:0 14px 24px;
      width:100%;
    }
    .card{
      background:var(--panel);
      border:1px solid rgba(255,255,255,.06);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    /* --- Online Users Sidebar --- */
    .card h3{
      margin:0; padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,.06);
      font-size:18px;
    }
    .users{padding:10px 8px; max-height:80vh; overflow-y:auto;}
    .user{
      display:flex; align-items:center; gap:10px;
      padding:10px 8px; border-radius:12px;
      transition:.2s; cursor:pointer;
    }
    .user:hover, .user.active{background:rgba(255,255,255,.08)}
    .avatar-img{
      width:32px; height:32px; border-radius:50%;
      object-fit:cover; border:2px solid var(--accent);
    }
    .u-name{font-weight:500}

    /* --- Chat Area --- */
    .chat-wrap{display:flex; flex-direction:column; gap:10px; height:80vh;}
    .chat-header{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px; background:var(--panel-2); border-radius:var(--radius) var(--radius) 0 0;
    }
    .room-pill{
      background:var(--accent); color:#111; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700;
    }
    .chat-box{
      flex:1; padding:12px; overflow-y:auto; 
      background:var(--panel); border-radius:0 0 var(--radius) var(--radius);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    
    /* Message Styling */
    .msg-row{
      display:flex; margin:8px 0; align-items:flex-end;
      animation:pop .14s ease-out;
    }
    @keyframes pop{from{transform:translateY(4px); opacity:.0} to{transform:none; opacity:1}}
    
    .msg-content{max-width:70%;}
    .msg{
      padding:10px 12px; border-radius:14px;
      background:var(--panel-2); border:1px solid rgba(255,255,255,.06);
      word-wrap:break-word; white-space:pre-wrap;
    }
    .me .msg-row{flex-direction:row-reverse;} /* Flip direction for sender */
    .me .msg{
      background:var(--accent); color:#111; border-color:var(--accent-2);
      border-bottom-right-radius: 4px; /* Tail effect */
    }
    .msg-row:not(.me) .msg{
      border-bottom-left-radius: 4px;
    }
    .meta{font-size:11px; color:var(--muted); margin-top:2px;}
    .me .meta{text-align:right;}

    /* Input area */
    .composer{
      display:flex; gap:10px; align-items:center; padding:8px;
      background:var(--panel-2); border-radius:0 0 var(--radius) var(--radius);
      position: sticky; bottom: 0;
    }
    .input{
      flex:1; height:44px; padding:0 14px; color:var(--text);
      background:var(--panel); border:1px solid rgba(255,255,255,.08);
      border-radius:12px; outline:none;
    }
    .btn{
      height:44px; width:44px; border-radius:12px; border:none; cursor:pointer;
      background:var(--accent); color:#0c0d18; font-size:1.2em;
      transition:.2s;
    }
    .btn:active{transform:translateY(1px)}
    .btn:disabled {background: #333; cursor: not-allowed;}

    /* --- Mobile Responsiveness --- */
    @media (max-width:900px){
      .page{
        grid-template-columns: 1fr;
        gap:0; /* Remove gap on mobile */
      }
      .sidebar{
        position:absolute; top:0; left:0; right:0; bottom:0;
        z-index:100;
        display:none; /* Start hidden */
        width:100%;
        max-height:100vh;
        overflow-y:auto;
      }
      .chat-wrap{
        height:auto; min-height:85vh;
        border-radius:var(--radius);
      }
      .menu-toggle{display:block;}
      .nav-inner {padding-right: 20px;}
    }
    .sidebar.open {display:block;}
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <div class="brand">Aura Hub Chat</div>
      <nav class="tabs" aria-label="Main">
        <a class="tab" href="/index.html">Home</a>
        <a class="tab active" href="/chat.html">Chat</a>
        <a class="tab" href="/profile.html">Profile</a>
        <a class="tab" href="/games.html">Games</a>
        <a class="tab" href="/videos.html">Videos</a>
      </nav>
      <button class="logout-btn" onclick="logout()">Logout</button>
      <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
    </div>
  </header>

  <main class="page">
    <aside class="card sidebar" id="usersSidebar">
      <h3>Online Users <span style="float:right; cursor:pointer; display:none" id="closeSidebar"><i class="fas fa-times"></i></span></h3>
      <div id="usersList" class="users">
        <div class="muted" style="padding:8px 10px;">Loading users...</div>
      </div>
    </aside>

    <section class="card chat-wrap">
      <div class="chat-header">
        <div style="font-weight:700; font-size:18px;" id="recipientUsername">Select a user to chat</div>
        <span class="room-pill" id="selfTag"></span>
      </div>

      <div id="chatBox" class="chat-box" aria-live="polite" aria-label="Messages">
        <div class="muted" style="text-align:center; padding:20px;">
            <i class="fas fa-comment-dots" style="font-size:2em; margin-bottom:10px;"></i><br>
            Please select a user from the Online Users list to start chatting.
        </div>
      </div>

      <form id="composer" class="composer" autocomplete="off">
        <input id="messageInput" class="input" type="text" placeholder="Type your message…" maxlength="1000" disabled />
        <button class="btn" type="submit" disabled><i class="fas fa-paper-plane"></i></button>
      </form>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // --- Initial Setup and Helpers ---
    const qs = (s) => document.querySelector(s);
    const getUsername = () => {
      const name = localStorage.getItem('username');
      if(!name || name === 'undefined' || !name.trim()){
        window.location.href = '/login.html';
        return 'Guest'; 
      }
      return name.trim();
    }
    const USERNAME = getUsername();
    
    // UI Elements
    const chatBox = qs('#chatBox');
    const messageInput = qs('#messageInput');
    const sendButton = qs('.composer button[type="submit"]');
    const usersList = qs('#usersList');
    const recipientHeader = qs('#recipientUsername');
    const composerForm = qs('#composer');
    const usersSidebar = qs('#usersSidebar');
    const menuToggle = qs('#menuToggle');
    const closeSidebar = qs('#closeSidebar');

    let currentRecipient = null; 
    
    if(qs('#selfTag')) qs('#selfTag').textContent = USERNAME;

    // Connect socket
    const socket = io();

    // --- Message Rendering ---
    function formatTime(d){
        return new Intl.DateTimeFormat([], {hour:'2-digit', minute:'2-digit'}).format(d);
    }
    function escapeHtml(str){
      return (str+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    
    function addMessage(msg, isSelf=false){
        if (msg.sender !== USERNAME && msg.sender !== currentRecipient) return; // Only show messages for the active chat

        const row = document.createElement('div');
        row.className = 'msg-row' + (isSelf || msg.sender === USERNAME ? ' me' : '');
        
        const content = document.createElement('div');
        content.className = 'msg-content';
        
        const bubble = document.createElement('div');
        bubble.className = 'msg';
        bubble.textContent = msg.text;
        
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${msg.sender} • ${formatTime(new Date(msg.timestamp || Date.now()))}`;

        content.appendChild(bubble);
        content.appendChild(meta);
        
        row.appendChild(content);

        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- User Management ---
    function startChat(recipient) {
        if (recipient === currentRecipient) return;

        currentRecipient = recipient;
        recipientHeader.textContent = `Chatting with: ${recipient}`;
        chatBox.innerHTML = ''; // Clear chat area

        // Enable input
        messageInput.disabled = false;
        sendButton.disabled = false;
        
        // Update active class in sidebar
        document.querySelectorAll('.user').forEach(el => el.classList.remove('active'));
        qs(`.user[data-username="${recipient}"]`).classList.add('active');
        
        // Hide sidebar on mobile after selection
        if (window.innerWidth <= 900) {
            usersSidebar.classList.remove('open');
        }
        
        // FIX: Add logic to fetch chat history here (if implemented on server)
    }

    function renderUsers(list=[]){
      usersList.innerHTML = '';
      list.forEach(u => {
        if (u === USERNAME) return;

        const el = document.createElement('div');
        el.className = 'user';
        el.dataset.username = u;
        
        const letter = (u||'?').slice(0,1).toUpperCase();
        
        // Placeholder Avatar (can be replaced with actual DP logic)
        const avatarHtml = `<div class="avatar-img" style="background:#2a2e4a; display:grid; place-items:center; color:#c8ccf0;">${letter}</div>`; 

        el.innerHTML = `
          ${avatarHtml}
          <div class="u-name">${u||'Unknown'}</div>
        `;
        
        // 🔑 FIX: Start chat on user click
        el.onclick = () => startChat(u); 
        
        usersList.appendChild(el);
      });
      if(list.length <= 1){
        usersList.innerHTML = `<div class="muted" style="padding:8px 10px;">No one else online</div>`;
      }
    }


    // --- Socket Logic ---
    socket.on('connect', () => {
      socket.emit('newUser', USERNAME); // Register user
    });

    socket.on("updateUsers", (users) => { // Array of usernames
      renderUsers(users);
    });
    
    // 🔑 FINAL FIX: Listener for private messages coming in
    socket.on("privateMessage", (msg) => {
        // Only display if it's the current active chat
        if (msg.sender === currentRecipient || msg.receiver === currentRecipient) {
             addMessage(msg);
        }
    });


    // --- Send Message Logic ---
    composerForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const text = messageInput.value.trim();
        if (!text || !currentRecipient) {
            if (!currentRecipient) alert("Please select a user to chat.");
            return;
        }

        // 🚨 FIX: Emit privateMessage with correct recipient
        const messagePayload = { 
            sender: USERNAME, 
            receiver: currentRecipient, 
            text: text 
        };
        
        socket.emit("privateMessage", messagePayload); 
        
        // Optimistic rendering (show my own message immediately)
        addMessage(messagePayload, true);
        
        messageInput.value = "";
        messageInput.focus();
    });

    // --- General Functions ---
    function logout() {
        localStorage.clear();
        window.location.href = "/login.html";
    }

    // --- Mobile Toggle ---
    menuToggle.addEventListener('click', () => {
        usersSidebar.classList.add('open');
        closeSidebar.style.display = 'block';
    });
    closeSidebar.addEventListener('click', () => {
        usersSidebar.classList.remove('open');
        closeSidebar.style.display = 'none';
    });
    // Ensure sidebar is closed when selecting a user on mobile
    document.querySelectorAll('.user').forEach(el => {
        el.addEventListener('click', () => {
             if (window.innerWidth <= 900) {
                usersSidebar.classList.remove('open');
                closeSidebar.style.display = 'none';
            }
        });
    });

  </script>
</body>
</html>
