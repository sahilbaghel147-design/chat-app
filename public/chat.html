<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura Hub - Chat</title>
  
  <script src="/socket.io/socket.io.js"></script>
  
  <style>
    /* 🌍 Global Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      /* Define Color Variables */
      --color-primary: #5e6bfe;
      --color-dark-bg: #181828;
      --color-chat-bg: #181828;
      --color-sidebar-bg: #1c1c2c;
      --color-component-bg: #2a2a3d;
      --color-text: #f0f0f0;
      --color-error: #ef4444;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      background: var(--color-dark-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    nav {
      background: linear-gradient(135deg, #5e6bfe, #4a59e6);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      flex-shrink: 0; /* Navbar should not shrink */
    }
    nav a {
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      transition: 0.3s;
    }
    nav a:hover {
      background: rgba(255,255,255,0.2);
    }
    nav a.active {
      background: rgba(255,255,255,0.3);
    }

    /* Main Layout */
    .chat-container {
      flex: 1;
      display: flex;
      /* FIX: Ensure container takes up remaining vertical space */
      height: calc(100vh - 50px); /* Assuming nav height is ~50px */
      overflow: hidden;
    }

    /* Sidebar (Online Users) */
    .sidebar {
      width: 220px;
      background: var(--color-sidebar-bg);
      border-right: 1px solid #333;
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0; /* Sidebar should not shrink */
      overflow-y: auto;
    }
    .sidebar h3 {
      margin: 0 0 10px;
      font-size: 1.1em;
      border-bottom: 1px solid #444;
      padding-bottom: 6px;
      color: var(--color-primary);
    }
    .user {
      padding: 8px;
      background: var(--color-component-bg);
      margin: 4px 0;
      border-radius: 8px;
      font-size: 0.9em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .user:hover {
        background: #3a3a5a;
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--color-chat-bg);
      padding: 0; /* Padding is inside chatBox */
      overflow: hidden;
    }
    #chatBox {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: var(--color-chat-bg);
      display: flex;
      flex-direction: column;
    }
    .msg-row {
      display: flex;
      margin: 6px 0;
      align-items: flex-end;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 15px;
      max-width: 70%;
      font-size: 0.95em;
      line-height: 1.4;
    }
    .me {
      background: var(--color-primary);
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 3px;
    }
    .other {
      background: var(--color-component-bg);
      color: var(--color-text);
      margin-right: auto;
      border-bottom-left-radius: 3px;
    }
    .username {
      font-size: 0.75em;
      opacity: 0.7;
      margin-bottom: 3px;
    }

    /* Input Area */
    #inputArea {
      display: flex;
      padding: 10px;
      background: var(--color-sidebar-bg);
      border-top: 1px solid #333;
      flex-shrink: 0; /* Input area must not shrink */
    }
    #messageInput {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: none;
      outline: none;
      background: var(--color-component-bg);
      color: white;
      font-size: 1em;
    }
    #sendButton {
      background: var(--color-primary);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      margin-left: 8px;
      color: white;
      font-size: 1.2em;
      cursor: pointer;
      transition: 0.2s;
    }
    #sendButton:hover {
      background: #4a59e6;
      transform: scale(1.05);
    }
  </style>
  </head>
<body>
  <nav>
    <a href="/index.html">Home</a>
    <a href="/chat.html" class="active">Chat</a>
    <a href="/profile.html">Profile</a>
    <a href="/games.html">Games</a>
    <a href="/about.html">About</a>
  </nav>

  <div class="chat-container">
    <div class="sidebar">
      <h3>🟢 Online Users</h3>
      <div id="usersList"></div>
    </div>

    <div class="chat-area">
      <div id="chatBox"></div>
      <div id="inputArea">
        <input type="text" id="messageInput" placeholder="Type your message..."/>
        <button id="sendButton">➤</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const username = localStorage.getItem("username") || "Guest";

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const usersList = document.getElementById("usersList");

    // FIX: Auth check - If not logged in, redirect
    if (username === "Guest") {
        window.location.href = "/login.html";
    }

    sendButton.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      
      // FIX: Assuming your backend expects 'chatMessage'
      socket.emit("chatMessage", { sender: username, text }); 
      messageInput.value = "";
    }

    socket.on("message", (msg) => {
      const row = document.createElement("div");
      row.classList.add("msg-row");

      const bubble = document.createElement("div");
      bubble.classList.add("msg");

      if (msg.sender === username) {
        bubble.classList.add("me");
        bubble.innerHTML = `<div class="username">You</div>${msg.text}`;
      } else {
        bubble.classList.add("other");
        bubble.innerHTML = `<div class="username">${msg.sender}</div>${msg.text}`;
      }

      row.appendChild(bubble);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    // Online users update
    // FIX: Using 'register' event if that's what server.js uses
    socket.emit("register", username); 
    socket.on("updateUsers", (users) => {
      usersList.innerHTML = "";
      users.forEach(u => {
        const div = document.createElement("div");
        div.classList.add("user");
        div.textContent = u;
        usersList.appendChild(div);
      });
    });
  </script>
</body>
</html>
