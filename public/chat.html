<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Hub Pro Chat</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top left, #1f1f39, #0d0d1a);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: rgba(60, 60, 100, 0.6);
    padding: 14px;
    text-align: center;
    font-size: 18px;
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #3a3a5e;
  }
  .chat-container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  .users {
    width: 30%;
    border-right: 1px solid #333;
    overflow-y: auto;
    background: rgba(20,20,40,0.6);
  }
  .user {
    padding: 15px;
    border-bottom: 1px solid #2a2a44;
    cursor: pointer;
    transition: 0.3s;
  }
  .user:hover, .user.active {
    background: #3e3e8e;
  }
  .chat-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #121225;
    position: relative;
  }
  .messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .message {
    margin: 8px 0;
    padding: 10px;
    border-radius: 10px;
    max-width: 75%;
    animation: fadeIn 0.3s;
    font-size: 15px;
  }
  .sender {
    background: linear-gradient(135deg, #4b5eff, #6a73ff);
    align-self: flex-end;
  }
  .receiver {
    background: #272753;
    align-self: flex-start;
  }
  .meta {
    font-size: 11px;
    opacity: 0.7;
    margin-top: 3px;
  }
  .input-area {
    display: flex;
    padding: 10px;
    background: rgba(30, 30, 60, 0.8);
    border-top: 1px solid #444;
  }
  .input-area input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #1b1b3b;
    color: white;
  }
  .input-area button {
    margin-left: 10px;
    background: #5b67ff;
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    transition: 0.3s;
  }
  .input-area button:hover {
    background: #7883ff;
  }
  .typing {
    font-size: 13px;
    color: #aaa;
    position: absolute;
    bottom: 60px;
    left: 15px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 768px) {
    .users {
      width: 100%;
      display: flex;
      overflow-x: auto;
    }
    .user {
      flex: 1;
      text-align: center;
    }
  }
</style>
</head>
<body>
<header>⚡ Aura Hub Pro</header>

<div class="chat-container">
  <div class="users" id="users"></div>
  <div class="chat-box">
    <div class="messages" id="messages">
      <p style="text-align:center;opacity:0.7;">Select a user to start chat</p>
    </div>
    <div class="typing" id="typing"></div>
    <div class="input-area">
      <input id="msgInput" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
const username = localStorage.getItem("username");
if (!username) window.location.href = "/login.html";
const socket = io();
socket.emit("registerUser", username);

const usersDiv = document.getElementById("users");
const messagesDiv = document.getElementById("messages");
const input = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const typingDiv = document.getElementById("typing");

let current = null;
let typingTimeout;

socket.on("updateUserList", ({ users }) => {
  usersDiv.innerHTML = '';
  users.forEach(u => {
    if (u !== username) {
      const div = document.createElement("div");
      div.classList.add("user");
      div.textContent = u;
      div.onclick = () => selectUser(u, div);
      usersDiv.appendChild(div);
    }
  });
});

function selectUser(u, div) {
  current = u;
  document.querySelectorAll(".user").forEach(e => e.classList.remove("active"));
  div.classList.add("active");
  messagesDiv.innerHTML = '';
  socket.emit("loadChat", { user1: username, user2: u });
}

socket.on("chatHistory", msgs => {
  messagesDiv.innerHTML = '';
  msgs.forEach(m => showMsg(m));
});

sendBtn.onclick = sendMsg;
input.onkeypress = e => {
  if (e.key === "Enter") sendMsg();
  socket.emit("typing", { sender: username, receiver: current });
};

socket.on("userTyping", sender => {
  if (sender === current) {
    typingDiv.textContent = `${sender} is typing...`;
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => typingDiv.textContent = '', 1500);
  }
});

function sendMsg() {
  const text = input.value.trim();
  if (!text || !current) return;
  socket.emit("privateMessage", { sender: username, receiver: current, text });
  input.value = '';
}

socket.on("privateMessage", m => showMsg(m));

function showMsg(m) {
  const div = document.createElement("div");
  div.classList.add("message", m.sender === username ? "sender" : "receiver");
  div.innerHTML = `
    <div>${m.text}</div>
    <div class="meta">${new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
  `;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}
</script>
</body>
</html>
